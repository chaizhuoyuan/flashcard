<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>认字小卡片</title>
<style>
  :root{--bg:#fef6e4;--card:#fff;--primary:#f582ae;--primary2:#8bd3dd;--good:#3da35d;--bad:#ef626c;--text:#172c66;--muted:#8a94a6;}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;}
  header{width:100%;max-width:1100px;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
  header h1{font-size:20px;margin:0;}
  .tabs{display:flex;gap:6px;}
  .tab{border:none;background:#fff;color:var(--text);padding:7px 14px;border-radius:20px;font-size:14px;cursor:pointer;font-weight:600;box-shadow:0 2px 0 #d6c9a8;}
  .tab.active{background:var(--primary);color:#fff;}
  main{width:100%;max-width:1100px;padding:0 18px 20px;flex:1;}
  .topbar{display:flex;gap:8px;align-items:center;margin:4px 0 12px;flex-wrap:wrap;}
  select{border:2px solid #e7d9bb;border-radius:14px;padding:8px 12px;font-size:15px;font-weight:600;background:#fff;color:var(--text);}
  .stats-bar{display:flex;gap:10px;margin:0 0 16px;flex-wrap:wrap;}
  .pill{background:#fff;border-radius:14px;padding:8px 14px;font-size:13px;font-weight:600;box-shadow:0 2px 0 #d6c9a8;}
  .pill b{font-size:17px;display:block;color:var(--primary);}
  .pill.green b{color:var(--good);} .pill.blue b{color:var(--primary2);}
  .card{background:var(--card);border-radius:28px;padding:22px 26px;box-shadow:0 8px 0 #e7d9bb;position:relative;user-select:none;display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:center;}
  .quiz-side{text-align:center;}
  .info-side{min-height:340px;display:flex;flex-direction:column;justify-content:center;}
  .lesson-tag{position:absolute;top:16px;left:18px;background:var(--primary2);color:#fff;font-size:13px;font-weight:700;padding:4px 12px;border-radius:12px;max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .quiz-q{font-size:14px;color:var(--muted);}
  .char{font-size:min(26vw,170px);line-height:1.05;font-weight:700;margin:6px 0;cursor:pointer;}
  .opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px;}
  .opt{border:2px solid #e7d9bb;background:#fff;border-radius:18px;padding:16px 8px;font-size:24px;font-weight:700;color:var(--text);cursor:pointer;transition:.12s;}
  .opt:active{transform:scale(.97);}
  .opt.correct{background:var(--good);color:#fff;border-color:var(--good);}
  .opt.wrong{background:var(--bad);color:#fff;border-color:var(--bad);}
  .opt.dim{opacity:.45;}
  .reveal{text-align:left;}
  .wait{color:var(--muted);text-align:center;font-size:14px;line-height:1.7;border:2px dashed #efe4ca;border-radius:18px;padding:24px 16px;}
  .reveal .top{display:flex;align-items:baseline;gap:10px;justify-content:center;}
  .reveal .bigpy{font-size:26px;font-weight:700;color:var(--primary);}
  .reveal .res{font-size:18px;font-weight:700;}
  .reveal .res.ok{color:var(--good);} .reveal .res.no{color:var(--bad);}
  .block{background:#fbf3e0;border-radius:14px;padding:10px 14px;margin-top:10px;font-size:15px;line-height:1.55;}
  .block .lbl{font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.5px;}
  .block .zh{font-size:18px;font-weight:700;}
  .block .en{color:#5a6478;font-size:14px;}
  .mastery-dots{display:flex;gap:6px;justify-content:center;margin-top:12px;}
  .dot{width:11px;height:11px;border-radius:50%;background:#e3dcc8;}
  .dot.on{background:var(--good);}
  .actions{display:flex;gap:14px;margin-top:16px;}
  .btn{border:none;border-radius:22px;padding:16px 10px;font-size:19px;font-weight:700;color:#fff;cursor:pointer;flex:1;}
  .btn.good{background:var(--good);box-shadow:0 5px 0 #2f8049;}
  .btn:active{transform:translateY(3px);box-shadow:none;}
  .sub-actions{display:flex;gap:10px;margin-top:12px;justify-content:center;}
  .ghost{background:#fff;border:none;border-radius:16px;padding:9px 16px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;box-shadow:0 2px 0 #d6c9a8;}
  .result{text-align:center;background:#fff;border-radius:28px;padding:28px 20px;box-shadow:0 8px 0 #e7d9bb;}
  .result .score{font-size:72px;font-weight:800;color:var(--primary);line-height:1;}
  .grade{font-size:30px;margin:8px 0 4px;}
  .result table{width:100%;border-collapse:collapse;margin-top:16px;font-size:15px;}
  .result td{padding:6px 4px;border-bottom:1px solid #f0e9d6;text-align:left;}
  .result td.r{text-align:right;color:var(--muted);}
  .manage textarea{width:100%;min-height:120px;border-radius:16px;border:2px solid #e7d9bb;padding:14px;font-size:22px;font-family:inherit;resize:vertical;}
  .manage .row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center;}
  .manage label{font-size:14px;font-weight:600;}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px;margin-top:18px;}
  .gchar{background:#fff;border-radius:14px;padding:8px 4px;text-align:center;box-shadow:0 2px 0 #d6c9a8;}
  .gchar .c{font-size:30px;} .gchar .py{font-size:11px;color:var(--muted);height:14px;overflow:hidden;}
  .gchar .bar{height:5px;border-radius:3px;background:#eee;margin-top:4px;overflow:hidden;}
  .gchar .bar i{display:block;height:100%;background:var(--good);}
  .empty{color:var(--muted);text-align:center;padding:40px 0;}
  .profile-bar{display:flex;gap:6px;align-items:center;margin:0 0 8px;flex-wrap:wrap;}
  .profile-btn{border:2px solid #e7d9bb;background:#fff;color:var(--text);padding:5px 12px;border-radius:16px;font-size:13px;font-weight:700;cursor:pointer;transition:.2s;}
  .profile-btn.active{background:var(--primary2);color:#fff;border-color:var(--primary2);}
  .profile-btn:hover{border-color:var(--primary2);}
  .timer-bar{width:100%;height:5px;background:#e3dcc8;border-radius:3px;margin-top:8px;overflow:hidden;}
  .timer-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--good),#ffd700,var(--bad));}
  .speed-badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:8px;margin-left:6px;}
  .speed-badge.fast{background:#ffd700;color:#172c66;}
  .speed-badge.normal{background:#e3dcc8;color:#172c66;}
  .prog-bar{height:14px;background:#eee;border-radius:7px;overflow:hidden;margin:4px 0}
  .prog-fill{height:100%;border-radius:7px;transition:width .5s}
  .milestones{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
  .ms{font-size:12px;font-weight:700;padding:3px 10px;border-radius:10px;background:#eee;color:var(--muted)}
  .ms.done{background:var(--good);color:#fff}
  .ms.current{background:#ffd700;color:#172c66;animation:pulse .8s infinite}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .toggle{display:flex;align-items:center;gap:6px;}
  input[type=number]{width:60px;border-radius:10px;border:2px solid #e7d9bb;padding:6px;font-size:15px;}
  .note{font-size:13px;color:var(--muted);margin:4px 0 8px;line-height:1.5;}
  @media(max-width:680px){.card{grid-template-columns:1fr;gap:10px;padding:14px 16px;}.info-side{min-height:0;}.char{font-size:min(30vw,140px);margin:2px 0;}.quiz-q{font-size:12px;}.opts{gap:8px;margin-top:8px;}.opt{padding:12px 6px;font-size:20px;}header h1{font-size:16px;}}
</style>
</head>
<body>
<header>
  <h1>📚 认字小卡片</h1>
  <div class="tabs">
    <button class="tab active" data-tab="review">复习 Review</button>
    <button class="tab" data-tab="manage">字表 List</button>
  </div>
  <span id="syncStatus" style="font-size:11px;color:var(--muted);cursor:pointer" onclick="loadFromCloud()">☁️</span>
</header>
<main>
  <section id="review">
    <div class="stats-bar" style="margin-bottom:8px">
      <div class="pill">本轮<b><span id="p-done">0</span>/<span id="p-total">0</span></b></div>
      <div class="pill green">答对<b id="p-right">0</b></div>
      <div class="pill blue">已掌握<b id="p-master">0</b></div>
      <button class="ghost" id="newRound" style="margin-left:auto">↻ 换一轮</button>
    </div>
    <div id="card-wrap"></div>
    <div id="progressPanel" style="background:#fff;border-radius:18px;padding:10px 14px;box-shadow:0 2px 0 #d6c9a8;margin-top:12px"></div>
    <div class="profile-bar" id="profileBar" style="margin-top:10px"></div>
    <div class="topbar" style="margin-top:6px">
      <select id="bookSel"></select>
      <select id="lessonSel"></select>
      <select id="modeSel" style="display:none"><option value="mix" selected>混合</option></select>
      <select id="roundSizeSel"></select>
      <button class="ghost" id="focusBtn" onclick="toggleFocus()" style="font-size:13px">🎯 Focus</button>
    </div>
  </section>
  <section id="manage" class="manage" style="display:none;">
    <p class="note">当前教材的生字（拼音、课次、双语例词/例句/字源已内置）。可编辑：一行一个「字 拼音」。保存后熟练度保留，内置字注释自动恢复。</p>
    <textarea id="charInput"></textarea>
    <div class="row">
      <button class="ghost" id="saveChars" style="background:var(--primary);color:#fff;">💾 保存字表</button>
      <button class="ghost" id="loadDefault">↩︎ 恢复本教材默认字表</button>
    </div>
    <div class="row">
      <div class="toggle"><label>每轮字数</label><input type="number" id="roundSize" min="3" value="10"></div>
      <div class="toggle"><label><input type="checkbox" id="autoSpeak" checked> 答完自动朗读</label></div>
    </div>
    <div class="row"><button class="ghost" id="resetProgress">🔄 清空本教材熟练度</button></div>
    <div id="charGrid" class="grid"></div>
  </section>
</main>

<script>
/* 每条：字, 拼音, 课次, 例词中, 例词英, 例句中, 例句英, 字源中, 字源英, [多音字读法] */
const L4A = [
  ["捞","lāo","1","打捞","to salvage","渔夫从水里捞起一条鱼。","The fisherman scooped a fish out of the water.","形声字：扌(手)表意——用手从水里取东西；劳(láo)表声。","Phono-semantic: 扌(hand)=meaning; 劳 láo=sound."],
  ["往","wǎng","1","往前走","walk forward","我们往学校走。","We walk toward the school.","形声字：彳(双立人，行走)表意，表示朝某方向去。","Phono-semantic: 彳(step/walk)=meaning 'to go toward'."],
  ["倒","dào／dǎo","1","摔倒","to fall down","他不小心摔倒了。","He accidentally fell down.","形声字：亻(人)表意，到表声。多音字 dǎo倒下／dào倒立。","Phono-semantic: 亻(person)=meaning, 到=sound.",[["dǎo","摔倒","to fall down"],["dào","倒立","to stand upside down"]]],
  ["挂","guà","1","挂画","hang a picture","墙上挂着一幅画。","A painting hangs on the wall.","形声字：扌(手)表意，圭表声——用手把东西悬起来。","Phono-semantic: 扌(hand)=meaning; 圭=sound."],
  ["另","lìng","2","另外","another","我还有另外一个问题。","I have another question.","表示「别的、其他的」。","Means 'another / other'."],
  ["碰","pèng","2","碰一下","give it a touch","别碰那个热锅。","Don't touch that hot pot.","形声字：石表意(硬物相撞)，并表声。","Phono-semantic: 石(stone)=meaning; 并=sound."],
  ["叹","tàn","2","叹气","to sigh","他难过地叹了一口气。","He sighed sadly.","形声字：口(口字旁)表意，又表声。","Phono-semantic: 口(mouth)=meaning; 又=sound."],
  ["宿","sù","3","住宿","to stay overnight","我们今晚在旅馆住宿。","We stay overnight at a hotel.","会意字：宀(房子)+人+席——人在屋里过夜。","Compound: 宀(roof)+person+mat = sleeping in a house."],
  ["尺","chǐ","3","尺子","ruler","我用尺子画直线。","I use a ruler to draw a line.","象形字：量长度的工具。","Pictograph: a tool for measuring length."],
  ["摘","zhāi","3","摘苹果","pick apples","秋天我们去摘苹果。","In autumn we pick apples.","形声字：扌(手)表意，啇表声。","Phono-semantic: 扌(hand)=meaning; 啇=sound."],
  ["敢","gǎn","3","勇敢","brave","他敢一个人睡觉。","He dares to sleep alone.","会意字：本义有胆量、不害怕。","Compound: to dare; brave."],
  ["语","yǔ","3","语言","language","中文是一种语言。","Chinese is a language.","形声字：讠(言)表意，吾表声。","Phono-semantic: 讠(speech)=meaning; 吾=sound."],
  ["恐","kǒng","3","恐龙","dinosaur","恐龙生活在很久以前。","Dinosaurs lived long ago.","形声字：心(心字底)表意，巩表声。","Phono-semantic: 心(heart)=meaning; 巩=sound."],
  ["惊","jīng","3","吃惊","be surprised","这个消息让我很吃惊。","The news surprised me.","形声字：忄(竖心旁)表意，京表声。","Phono-semantic: 忄(heart)=meaning; 京=sound."],
  ["支","zhī","4","支持","to support","妈妈支持我学画画。","Mom supports me learning to draw.","会意字：手持竹枝；引申撑起、分支。","Compound: a hand holding a branch."],
  ["贪","tān","4","贪吃","greedy for food","小猫很贪吃。","The kitten is greedy for food.","形声字：贝(钱财)表意，今表声。","Phono-semantic: 贝(money)=meaning; 今=sound."],
  ["仙","xiān","4","神仙","immortal","故事里有一位神仙。","There is an immortal in the story.","会意字：人+山——住在山里修行的人。","Compound: person+mountain = an immortal."],
  ["神","shén","4","神仙","deity","人们相信天上有神。","People believe there are gods.","形声字：礻(示字旁)表意，申表声。","Phono-semantic: 礻(spirit)=meaning; 申=sound."],
  ["射","shè","4","射箭","shoot an arrow","他用弓射箭。","He shoots arrows with a bow.","会意字：身(弓箭)+寸(手)。","Compound: bow + hand = to shoot."],
  ["金","jīn","5","金子","gold","金子闪闪发光。","The gold shines brightly.","象形字：表示金属、黄金。","Pictograph: metal, gold."],
  ["银","yín","5","银行","bank","妈妈去银行取钱。","Mom goes to the bank.","形声字：钅(金属)表意，艮表声。","Phono-semantic: 钅(metal)=meaning; 艮=sound."],
  ["珠","zhū","5","珍珠","pearl","项链上有一颗珍珠。","There is a pearl on the necklace.","形声字：王(玉)表意，朱表声。","Phono-semantic: 玉(jade)=meaning; 朱=sound."],
  ["滚","gǔn","5","滚动","to roll","皮球滚到了门外。","The ball rolled out the door.","形声字：氵(水)表意，衮表声。","Phono-semantic: 氵(water)=meaning; 衮=sound."],
  ["故","gù","6","故事","story","奶奶给我讲故事。","Grandma tells me a story.","形声字：攵(动作)表意，古表声。","Phono-semantic: 攵(action)=meaning; 古=sound."],
  ["觉","jué／jiào","6","睡觉","to sleep","我每天九点睡觉。","I go to sleep at nine.","形声字：见表意(感知)。多音字 jué感觉／jiào睡觉。","Phono-semantic: 见(perceive)=meaning.",[["jiào","睡觉","to sleep"],["jué","感觉","to feel"]]],
  ["幅","fú","6","一幅画","a painting (m.w.)","他画了一幅画。","He painted a picture.","形声字：巾(布)表意，畐表声。","Phono-semantic: 巾(cloth)=meaning; 畐=sound."],
  ["墙","qiáng","6","围墙","wall","花园外面有一道围墙。","There is a wall around the garden.","形声字：土(土字旁)表意，啬表声。","Phono-semantic: 土(earth)=meaning; 啬=sound."],
  ["匹","pǐ","7","一匹马","a horse (m.w.)","草地上有一匹马。","There is a horse on the grass.","量词，用于马和布。","A measure word for horses and cloth."],
  ["咬","yǎo","7","咬一口","take a bite","他咬了一口苹果。","He took a bite of the apple.","形声字：口(用牙咬)表意，交表声。","Phono-semantic: 口(mouth)=meaning; 交=sound."],
  ["烧","shāo","7","发烧","have a fever","他生病发烧了。","He got sick and had a fever.","形声字：火(火字旁)表意，尧表声。","Phono-semantic: 火(fire)=meaning; 尧=sound."],
  ["粗","cū","7","粗心","careless","他很粗心，做错了题。","He is careless and got it wrong.","形声字：米(糙米)表意，且表声。","Phono-semantic: 米(rice)=meaning; 且=sound."],
  ["拔","bá","8","拔牙","pull a tooth","我去医院拔牙。","I went to pull a tooth.","形声字：扌(手)表意，犮表声。","Phono-semantic: 扌(hand)=meaning; 犮=sound."],
  ["害","hài","8","害怕","to be afraid","妹妹害怕打雷。","My sister is afraid of thunder.","会意字：本义伤害、灾害、害怕。","Compound: harm; to fear."],
  ["糖","táng","8","吃糖","eat candy","小孩子喜欢吃糖。","Children like to eat candy.","形声字：米(米字旁)表意，唐表声。","Phono-semantic: 米(grain)=meaning; 唐=sound."],
  ["送","sòng","8","送礼物","give a gift","我送给妈妈一个礼物。","I give Mom a gift.","会意字：辶(走)表意——带去给别人。","Compound: 辶(walk)=meaning. To give."],
  ["甜","tián","9","甜食","sweets","西瓜很甜。","The watermelon is sweet.","会意字：舌+甘——舌头尝到甘甜。","Compound: tongue+sweet = tastes sweet."],
  ["疼","téng","9","疼爱","to dote on","爷爷很疼爱我。","Grandpa dotes on me.","形声字：疒(病字旁)表意，冬表声。","Phono-semantic: 疒(illness)=meaning; 冬=sound."],
];

const G1A = [
  ["人","rén","识字1 天地人","人们","people","教室里有很多人。","There are many people in the classroom.","象形字：像一个侧面站立的人。","Pictograph: a person standing in profile."],
  ["天","tiān","识字1 天地人","天空","sky","天上有白云。","There are white clouds in the sky.","会意字：「大」上一横，表示人头顶上的天。","A line above 大(person) = the sky overhead."],
  ["地","dì","识字1 天地人","地上","on the ground","地上有一片叶子。","There is a leaf on the ground.","形声字：土(土地)表意，也表声。","Phono-semantic: 土(earth)=meaning; 也=sound."],
  ["一","yī","识字2 金木水火土","一个","one","我有一本书。","I have one book.","指事字：一横表示「一」。","Indicative: one stroke means 'one'."],
  ["二","èr","识字2 金木水火土","二月","February","我家在二楼。","My home is on the second floor.","指事字：两横表示「二」。","Indicative: two strokes mean 'two'."],
  ["三","sān","识字2 金木水火土","三天","three days","一周我上三天课。","I have class three days a week.","指事字：三横表示「三」。","Indicative: three strokes mean 'three'."],
  ["上","shàng","识字2 金木水火土","上面","above","桌上有一支笔。","There is a pen on the table.","指事字：横上一短画，表示「上面」。","Indicative: a mark above the line = 'above'."],
  ["口","kǒu","识字3 口耳目","开口","open the mouth","张开口说话。","Open your mouth to speak.","象形字：像人的嘴巴。","Pictograph: a mouth."],
  ["耳","ěr","识字3 口耳目","耳朵","ear","兔子的耳朵很长。","The rabbit's ears are long.","象形字：像耳朵的形状。","Pictograph: shaped like an ear."],
  ["目","mù","识字3 口耳目","目光","gaze","我用目光看着他。","I looked at him.","象形字：像眼睛，里面是眼珠。","Pictograph: an eye with a pupil."],

  ["下","xià","A 5-6","下面","under / below","小狗躲在桌子下面。","The puppy hides under the table.","指事字，一长横代表地面，下面加一短横表示在下方。","An indicative character: a long line is the ground, and a short mark below shows the position 'down'.",""],
  ["美","měi","A 5-6","美丽","beautiful","花园里的花真美。","The flowers in the garden are so beautiful.","会意字，上面是羊下面是大，古人觉得肥大的羊很美好。","An associative character: 'sheep' above 'big', as ancient people saw a big sheep as something fine and beautiful.",""],
  ["国","guó","A 5-6","中国","China","我爱我的国家。","I love my country.","会意字，外面方框是国界，里面的玉表示宝贵的疆土。","An associative character: the outer box is the border, and 'jade' inside means the precious land.",""],
  ["人","rén","A 7-8","大人","adult / grown-up","街上有很多人。","There are many people on the street.","象形字，像一个侧身站立的人，伸出胳膊和腿。","A pictograph of a person standing sideways with an arm and leg.",""],
  ["头","tóu","A 7-8","头发","hair","我用手摸摸头。","I touch my head with my hand.","形声字，是繁体'頭'的简化字，原本右边页表头部的意思。","A simplified form of 頭; the original right part meant the head.",""],
  ["耳","ěr","A 7-8","耳朵","ear","兔子的耳朵很长。","The rabbit's ears are very long.","象形字，像人的一只耳朵的样子。","A pictograph drawn in the shape of a human ear.",""],
  ["目","mù","A 7-8","目光","gaze / sight","他用目光看着我。","He looks at me with his eyes.","象形字，原本是横着的眼睛，后来立起来写，里面横笔是眼珠。","A pictograph of an eye, later written upright, with the inner strokes as the pupil.",""],
  ["牙","yá","A 7-8","牙齿","tooth / teeth","我每天早晚刷牙。","I brush my teeth every morning and night.","象形字，像上下牙齿交错咬合的样子。","A pictograph showing upper and lower teeth interlocking.",""],
  ["口","kǒu","A 7-8","开口","to open one's mouth","张开口，啊一声。","Open your mouth and say 'ah'.","象形字，像张开的嘴巴的样子。","A pictograph in the shape of an open mouth.",""],
  ["舌","shé","A 7-8","舌头","tongue","小狗伸出舌头喝水。","The puppy sticks out its tongue to drink water.","象形字，下面是口，上面像从嘴里伸出的舌头。","A pictograph: 'mouth' below and a tongue sticking out above.",""],
  ["手","shǒu","A 9-10","小手","little hand","我们拍拍小手。","We clap our little hands.","象形字，像一只张开五根手指的手。","A pictograph of a hand with five spread fingers.",""],
  ["足","zú","A 9-10","足球","soccer / football","哥哥喜欢踢足球。","My older brother likes to play soccer.","象形字，上面是膝盖下面是脚掌，表示人的脚。","A pictograph: a knee on top and a foot below, meaning a person's foot.",""],
  ["男","nán","A 9-10","男孩","boy","那个男孩在跑步。","That boy is running.","会意字，上面是田下面是力，表示在田里出力的男子。","An associative character: 'field' above 'strength', meaning a man working in the field.",""],
  ["女","nǚ","A 9-10","女孩","girl","那个女孩在唱歌。","That girl is singing.","象形字，像一个双手交叉、屈膝跪坐的女子。","A pictograph of a woman kneeling with her hands crossed.",""],
  ["牛","niú","A 9-10","小牛","calf / little cow","牛在草地上吃草。","The cow is eating grass on the meadow.","象形字，像牛头的样子，上面两笔是牛角。","A pictograph of an ox head, with the two top strokes as the horns.",""],
  ["羊","yáng","A 9-10","小羊","lamb / little sheep","小羊跟着妈妈走。","The little lamb follows its mother.","象形字，像羊头的样子，上面是弯弯的羊角。","A pictograph of a sheep's head, with curved horns on top.",""],
  ["马","mǎ","A 9-10","小马","pony / little horse","小马跑得很快。","The little horse runs very fast.","象形字，是繁体'馬'的简化字，原本像马的头、鬃毛和四条腿。","A simplified pictograph of 馬, originally showing a horse's head, mane and legs.",""],
  ["鸟","niǎo","A 9-10","小鸟","little bird","小鸟在树上唱歌。","The little bird sings in the tree.","象形字，像一只鸟的样子，有眼睛、翅膀和爪子。","A pictograph of a bird, with an eye, wing and claw.",""],
  ["虫","chóng","A 9-10","小虫","little bug / insect","一只小虫爬过来了。","A little bug is crawling over.","象形字，原本像一条小蛇或虫子弯曲的身体。","A pictograph originally drawn as the curving body of a small snake or worm.",""],
  ["木","mù","B 1-2","木头","wood","这把椅子是木头做的。","This chair is made of wood.","象形字，像一棵树，上面是树枝下面是树根。","A pictograph of a tree, with branches above and roots below.",""],
  ["禾","hé","B 1-2","禾苗","seedling (of rice/grain)","田里的禾苗绿绿的。","The grain seedlings in the field are green.","象形字，画的是一株成熟下垂的谷子，上面是穗，下面是根和茎。","A pictograph showing a stalk of grain with a drooping ripe head on top and roots below.",""],
  ["米","mǐ","B 1-2","大米","rice","我们用大米煮饭。","We use rice to cook a meal.","象形字，画的是稻穗上一颗颗散开的米粒。","A pictograph showing scattered grains of rice on a stalk.",""],
  ["草","cǎo","B 1-2","小草","grass","小草从土里长出来。","The little grass grows up out of the soil.","形声字，上面草字头表意，表示和植物有关，下面“早”表声。","A phono-semantic character: the grass radical on top gives the plant meaning, while 早 below gives the sound.",""],
  ["花","huā","B 1-2","花朵","flower","春天的花朵真好看。","The flowers in spring are so pretty.","形声字，上面草字头表意，和植物有关，下面“化”表声。","A phono-semantic character: the grass radical gives the plant meaning, and 化 below gives the sound.",""],
  ["竹","zhú","B 1-2","竹子","bamboo","熊猫最爱吃竹子。","Pandas love to eat bamboo the most.","象形字，画的是两根竹枝和下垂的竹叶。","A pictograph showing two bamboo stems with hanging leaves.",""],
  ["天","tiān","B 1-2","天空","sky","天空中有许多白云。","There are many white clouds in the sky.","指事字，在“大”（人）的头顶上加一横，指人头顶上方的天。","An indicative character: a line added above 大 (a person) points to the sky over one's head.",""],
  ["空","kōng","B 1-2","天空","sky","天空又高又蓝。","The sky is high and blue.","形声字，上面“穴”表意，和洞、空间有关，下面“工”表声。","A phono-semantic character: 穴 (cave) on top gives the meaning of space, and 工 below gives the sound.","天空的空（kōng，sky）；有空的空（kòng，free time）"],
  ["太","tài","B 1-2","太阳","sun","太阳升起来了。","The sun has risen.","指事字，在“大”下加一点，表示比大还要大、最高的意思。","An indicative character: a dot added under 大 (big) means even bigger or greatest.",""],
  ["阳","yáng","B 1-2","太阳","sun","太阳照得我暖暖的。","The sun shines and makes me warm.","形声字，左边“阝”（山）表意，和山的向阳面有关，右边“日”表意又表声。","A phono-semantic character: the left mound radical relates to a sunny hillside, and 日 (sun) carries both meaning and sound.",""],
  ["亮","liàng","B 1-2","明亮","bright","灯一开，屋里很亮。","When the light is on, the room is very bright.","会意字，上面是高高的楼台，下面是人，表示站在高处看得明、看得亮。","A compound-meaning character showing a tall tower above a person, suggesting bright and clear light from a high place.",""],
  ["星","xīng","B 3-4","星星","star","夜里星星亮晶晶。","At night the stars sparkle and shine.","形声字，上面“日”表意，和发光的天体有关，下面“生”表声。","A phono-semantic character: 日 (sun) on top relates to shining bodies, and 生 below gives the sound.",""],
  ["白","bái","B 3-4","白色","white","雪是白色的。","Snow is white.","象形字，像太阳刚升起射出的白光，表示白色。","A pictograph resembling the white light of the rising sun, meaning the color white.",""],
  ["黑","hēi","B 3-4","黑色","black","晚上天黑了。","At night the sky turns dark.","会意字，上面是窗口烟囱，下面是火，火烟把东西熏黑，表示黑色。","A compound-meaning character showing a chimney above fire, where smoke blackens things, meaning the color black.",""],
  ["云","yún","B 3-4","白云","cloud","白云在天上飘。","The white clouds float in the sky.","象形字，画的是天上一团团卷曲的云气。","A pictograph showing curling wisps of cloud in the sky.",""],
  ["风","fēng","B 3-4","大风","strong wind","今天刮起了大风。","A strong wind is blowing today.","形声字，外面“几”表声，里面“虫”表意，古人以为风动则虫生。","A phono-semantic character: 几 outside gives the sound, and 虫 (insect) inside gives the meaning, as ancients linked wind to creatures stirring.",""],
  ["雨","yǔ","B 3-4","下雨","to rain","下雨了，快回家。","It's raining, hurry home.","象形字，上面是天和云，下面的点是落下来的雨滴。","A pictograph: the top shows sky and cloud, and the dots below are falling raindrops.",""],
  ["雪","xuě","B 3-4","下雪","to snow","冬天下雪真好玩。","Snowing in winter is so much fun.","会意字，上面“雨”表意，和天气有关，下面是手，表示可以用手捧的雪。","A compound-meaning character: 雨 (rain) on top relates to weather, and the hand below shows snow you can scoop up.",""],
  ["电","diàn","B 3-4","电灯","electric light","晚上电灯很明亮。","The electric light is very bright at night.","象形字，原是“雷电”中弯曲闪亮的闪电形状。","A pictograph originally showing the zigzag shape of a flash of lightning.",""],
  ["春","chūn","B 5-6","春天","spring","春天来了，花开了。","Spring has come and the flowers bloom.","会意兼形声字，下面“日”表意，太阳照暖大地，上部表声，表示草木生长的春天。","A character with the sun 日 below giving the meaning of warm sunshine, while the top part gives the sound, for the season when plants grow.",""],
  ["来","lái","B 5-6","过来","to come over","请你过来一下。","Please come over for a moment.","象形字，本画的是一株麦子，后来借用来表示“来去”的来。","A pictograph originally showing a wheat plant, later borrowed to mean 'to come'.",""],
  ["了","le","B 5-6","好了","done; ready","作业写好了。","The homework is finished.","象形字，像婴儿包起两臂的样子，后多用作表示完成的语气词。","A pictograph resembling a baby with arms wrapped up, later used mainly as a particle marking completion.","好了的了（le，done (particle)）；了不起的了（liǎo，amazing）"],
  ["芽","yá","B 5-6","发芽","to sprout","小种子发芽了。","The little seed has sprouted.","形声字，上面草字头表意，和植物有关，下面“牙”表声。","A phono-semantic character: the grass radical on top gives the plant meaning, and 牙 below gives the sound.",""],
  ["早","zǎo","B 5-6","早上","morning","我每天早上去上学。","I go to school every morning.","会意字，上面是太阳「日」，下面是「十」，表示太阳升到树梢的早晨。","A compound ideograph: the sun (日) above shows morning when the sun rises.",""],
  ["好","hǎo","B 5-6","好人","good person","你今天真是好孩子。","You are such a good child today.","会意字，由「女」和「子」组成，女子抱着孩子表示美好。","A compound ideograph: a woman (女) and a child (子) together mean good.","好人的好（hǎo，good）；爱好的好（hào，hobby）"],
  ["起","qǐ","B 5-6","起床","to get up","我早上七点起床。","I get up at seven in the morning.","形声字，「走」作形旁表跑动起身，「己」作声旁表读音。","A phono-semantic character: 走 (run) gives the meaning, 己 gives the sound.",""],
  ["得","dé","B 5-6","得到","to obtain","我得到一个新玩具。","I got a new toy.","会意字，本义是手取到贝（钱），表示获得。","A compound ideograph: a hand taking a shell (money) means to obtain.","得到的得（dé，to get）；跑得快的得（de，(particle)）；我得走的得（děi，must）"],
  ["树","shù","B 5-6","大树","big tree","院子里有一棵大树。","There is a big tree in the yard.","形声字，「木」作形旁表与树木有关，右边表声。","A phono-semantic character: 木 (wood) gives the meaning, the right side gives the sound.",""],
  ["你","nǐ","B 5-6","你好","hello","你好，我叫小明。","Hello, my name is Xiaoming.","形声字，「亻（人）」作形旁表示人，右边表声。","A phono-semantic character: 亻(person) gives the meaning, the right side gives the sound.",""],
  ["回","huí","B 7-8","回家","to go home","放学后我回家吃饭。","After school I go home to eat.","象形字，像水流回旋打转的样子，表示返回。","A pictograph: it pictures swirling water, meaning to return.",""],
  ["家","jiā","B 7-8","家人","family","我爱我的家人。","I love my family.","会意字，上面是房子「宀」，下面是「豕（猪）」，屋里养猪即是家。","A compound ideograph: a roof (宀) over a pig (豕) means home.",""],
  ["爸","bà","B 7-8","爸爸","dad","爸爸带我去公园。","Dad takes me to the park.","形声字，「父」作形旁表父亲，「巴」作声旁表读音。","A phono-semantic character: 父 (father) gives the meaning, 巴 gives the sound.",""],
  ["妈","mā","B 7-8","妈妈","mom","妈妈做的饭很香。","The food Mom makes is delicious.","形声字，「女」作形旁表女性，「马」作声旁表读音。","A phono-semantic character: 女 (woman) gives the meaning, 马 gives the sound.",""],
  ["哥","gē","B 7-8","哥哥","older brother","哥哥比我高一点。","My older brother is a bit taller than me.","会意字，由两个「可」叠成，借作哥哥的哥。","A compound character made of two 可, borrowed to mean older brother.",""],
  ["姐","jiě","B 7-8","姐姐","older sister","姐姐喜欢画画。","My older sister likes to draw.","形声字，「女」作形旁表女性，「且」作声旁表读音。","A phono-semantic character: 女 (woman) gives the meaning, 且 gives the sound.",""],
  ["弟","dì","B 7-8","弟弟","younger brother","我和弟弟一起玩。","My younger brother and I play together.","象形字，像绳子缠绕木桩，本表次序，借指弟弟。","A pictograph of cord wound on a stake, showing order, borrowed for younger brother.",""],
  ["妹","mèi","B 7-8","妹妹","younger sister","妹妹还很小。","My younger sister is still very little.","形声字，「女」作形旁表女性，「未」作声旁表读音。","A phono-semantic character: 女 (woman) gives the meaning, 未 gives the sound.",""],
  ["儿","ér","B 7-8","儿子","son","他是妈妈的儿子。","He is his mother's son.","象形字，像小孩头顶囟门未合的样子，指小孩。","A pictograph of a child with an open fontanelle, meaning child.",""],
  ["子","zi","B 7-8","孩子","child","这个孩子很可爱。","This child is very cute.","象形字，像婴儿在襁褓中张开两臂的样子。","A pictograph of a baby with outstretched arms in swaddling.","孩子的子（zi，-y/child (suffix)）；子女的子（zǐ，children）"],
  ["和","hé","B 7-8","和气","friendly","我和姐姐去上学。","My sister and I go to school.","形声字，「口」作形旁表与说话有关，「禾」作声旁表读音。","A phono-semantic character: 口 (mouth) gives the meaning, 禾 gives the sound.","你和我的和（hé，and）；和面的和（huó，to knead dough）"],
  ["高","gāo","B 9-10","高大","tall and big","这棵树长得很高。","This tree grows very tall.","象形字，像一座高高的楼台房屋，表示高。","A pictograph of a tall building, meaning tall or high.",""],
  ["地","dì","B 9-10","土地","land","小草从地里长出来。","Grass grows up out of the ground.","形声字，「土」作形旁表土地，「也」作声旁表读音。","A phono-semantic character: 土 (earth) gives the meaning, 也 gives the sound.","土地的地（dì，land）；慢慢地的地（de，(adverb particle)）"],
  ["房","fáng","B 9-10","房子","house","我家住在大房子里。","My family lives in a big house.","形声字，「户」作形旁表门户房屋，「方」作声旁表读音。","A phono-semantic character: 户 (door) gives the meaning, 方 gives the sound.",""],
  ["门","mén","B 9-10","大门","gate","请把门关好。","Please close the door.","象形字，像两扇可以开关的门，表示门。","A pictograph of two door panels, meaning door.",""],
  ["笑","xiào","B 9-10","笑话","joke","妹妹笑得很开心。","My little sister laughs happily.","会意字，上面是「竹」，下面像人笑弯腰的样子，表示笑。","A compound ideograph: bamboo (竹) above a bending figure, meaning to laugh.",""],
  ["有","yǒu","B 9-10","有人","someone is there / to have someone","我有一个红气球。","I have a red balloon.","会意字，上面像一只手，下面是\"月(肉)\"，表示手里拿着肉，本义是\"拥有\"。","An ideogrammic compound: a hand above holding \"meat\" below, meaning \"to have/possess.\"",""],
  ["说","shuō","C 1-2","说话","to speak / to talk","老师说我很聪明。","The teacher says I am very smart.","形声字，\"讠(言)\"是形旁表示和说话有关，\"兑\"是声旁表声。","A phono-semantic compound: \"言/讠\" (speech) gives the meaning, \"兑\" gives the sound.",""],
  ["话","huà","C 1-2","说话","to talk / speech","我会说中国话。","I can speak Chinese.","形声字，\"讠(言)\"是形旁表示和语言有关，\"舌\"是声旁兼表意(用舌头说话)。","A phono-semantic compound: \"言/讠\" (speech) gives the meaning and \"舌\" (tongue) hints at speaking.",""],
  ["岁","suì","C 1-2","几岁","how old","我今年七岁了。","I am seven years old this year.","会意字，上面是\"山\"，下面是\"夕(月)\"，表示岁月、年岁。","An ideogrammic compound combining \"山\" (mountain) and \"夕\" (evening), meaning \"year/age.\"",""],
  ["学","xué","C 1-2","上学","to go to school","我喜欢学画画。","I like to learn drawing.","会意字，上面像两只手捧着算筹，下面是\"子(孩子)\"，表示孩子学习。","An ideogrammic compound: hands holding learning tools above a \"child\" below, meaning \"to learn.\"",""],
  ["我","wǒ","C 1-2","我们","we / us","我是一个小学生。","I am a primary school student.","象形字，本来画的是一种带齿的兵器，后来被借用来表示\"我\"。","A pictograph originally depicting a toothed weapon, later borrowed to mean \"I/me.\"",""],
  ["叫","jiào","C 1-2","叫声","a cry / a call","妈妈叫我回家吃饭。","Mom calls me home to eat.","形声字，\"口\"是形旁表示和嘴有关，\"丩\"是声旁表声。","A phono-semantic compound: \"口\" (mouth) gives the meaning, \"丩\" gives the sound.",""],
  ["华","huá","C 1-2","中华","China / Chinese","我们都是中华儿女。","We are all children of China.","形声字，下面\"十\"等部件表声，本义指花朵盛开、光彩美丽。","A phono-semantic compound; originally meant blossoming flowers and splendor, now also \"China.\"",""],
  ["也","yě","C 1-2","也是","also is","我也想去公园玩。","I also want to go play in the park.","象形字，本来像一种器物的样子，后来被借用作虚词\"也\"。","A pictograph originally depicting a vessel, later borrowed as the word \"also.\"",""],
  ["飞","fēi","C 3-4","飞机","airplane","小鸟在天上飞。","The little bird flies in the sky.","象形字，像鸟儿张开翅膀飞翔的样子。","A pictograph depicting a bird spreading its wings to fly.",""],
  ["狗","gǒu","C 3-4","小狗","puppy / little dog","小狗在草地上跑。","The puppy runs on the grass.","形声字，\"犭(犬)\"是形旁表示和狗有关，\"句\"是声旁表声。","A phono-semantic compound: \"犬/犭\" (dog) gives the meaning, \"句\" gives the sound.",""],
  ["鱼","yú","C 3-4","小鱼","little fish","小鱼在水里游来游去。","The little fish swims back and forth in the water.","象形字，像一条鱼的样子，有头、身和尾巴。","A pictograph depicting a fish with its head, body, and tail.",""],
  ["游","yóu","C 3-4","游泳","to swim","我们去河里游泳。","We go swimming in the river.","形声字，\"氵(水)\"是形旁表示和水有关，右边表声，本义指在水里游动。","A phono-semantic compound: \"氵\" (water) gives the meaning, the right side gives the sound; means \"to swim.\"",""],
  ["青","qīng","C 3-4","青草","green grass","春天的青草绿绿的。","The spring grass is green.","会意字，上面是\"生\"，下面是\"丹\"，表示像草木初生的青绿颜色。","An ideogrammic compound suggesting the fresh green color of sprouting plants.",""],
  ["蛙","wā","C 3-4","青蛙","frog","青蛙呱呱地叫。","The frog croaks \"ribbit ribbit.\"","形声字，\"虫\"是形旁表示是动物，\"圭\"是声旁表声。","A phono-semantic compound: \"虫\" (insect/creature) gives the meaning, \"圭\" gives the sound.",""],
  ["跑","pǎo","C 3-4","跑步","to run / jogging","小朋友们一起跑步。","The kids run together.","形声字，\"足(⻊)\"是形旁表示和脚有关，\"包\"是声旁表声。","A phono-semantic compound: \"足\" (foot) gives the meaning, \"包\" gives the sound.",""],
  ["跳","tiào","C 3-4","跳高","high jump","小兔子跳得很高。","The little rabbit jumps very high.","形声字，\"足(⻊)\"是形旁表示和脚有关，\"兆\"是声旁表声。","A phono-semantic compound: \"足\" (foot) gives the meaning, \"兆\" gives the sound.",""],
  ["朋","péng","C 5-6","朋友","friend","他是我的好朋友。","He is my good friend.","象形字，本来像两串贝壳并在一起，表示朋友、同伴。","A pictograph originally showing two strings of shells together, meaning \"friend/companion.\"",""],
  ["友","yǒu","C 5-6","友好","friendly","同学之间要友好。","Classmates should be friendly to each other.","会意字，像两只手往同一个方向相握，表示朋友互相帮助。","An ideogrammic compound of two hands reaching the same way, meaning \"friendship.\"",""],
  ["走","zǒu","C 5-6","走路","to walk","我们慢慢地走回家。","We slowly walk back home.","会意字，上面像一个人摆动手臂，下面是\"止(脚)\"，表示快步行走。","An ideogrammic compound: a person swinging arms above a \"foot\" below, meaning \"to walk/run.\"",""],
  ["都","dōu","C 5-6","都是","all are","我们都喜欢吃水果。","We all like to eat fruit.","形声字，\"阝(邑)\"是形旁表示和城邑有关，\"者\"是声旁表声。","A phono-semantic compound: \"阝\" (city) gives the meaning, \"者\" gives the sound.","都是的都（dōu，all）；首都的都（dū，capital city）"],
  ["他","tā","C 5-6","他们","they (male) / them","他是我的同学。","He is my classmate.","形声字，\"亻(人)\"是形旁表示和人有关，\"也\"是声旁表声，指别的男人。","A phono-semantic compound: \"亻\" (person) gives the meaning, \"也\" gives the sound; means \"he.\"",""],
  ["们","men","C 5-6","我们","we / us","我们一起去上学。","We go to school together.","形声字，单人旁表示与人有关，右边\"门\"表声。","A phono-semantic character: the person radical shows meaning (people), and 门 gives the sound.",""],
  ["是","shì","C 5-6","是的","yes / that's right","这是我的书包。","This is my schoolbag.","会意字，上边\"日\"下边\"正\"，本指正确，引申为\"对、是\"。","An associative character: 日 (sun) over 正 (correct), meaning right or to be.",""],
  ["晚","wǎn","C 7-8","晚上","evening / night","晚上天黑了。","It gets dark at night.","形声字，日旁表示与时间有关，右边\"免\"表声。","A phono-semantic character: the sun radical shows it relates to time, 免 gives the sound.",""],
  ["安","ān","C 7-8","平安","safe / peaceful","晚安，做个好梦。","Good night, sweet dreams.","会意字，宝盖头表示房子，里面有\"女\"，表示家中平安。","An associative character: a roof (宀) over 女 (woman), showing peace and safety at home.",""],
  ["睡","shuì","C 7-8","睡觉","to sleep","宝宝睡着了。","The baby has fallen asleep.","形声字，目旁表示与眼睛有关，右边\"垂\"表声。","A phono-semantic character: the eye radical (目) shows meaning, 垂 gives the sound.",""],
  ["里","lǐ","C 7-8","里面","inside","小猫在箱子里。","The kitten is inside the box.","会意字，上\"田\"下\"土\"，本指村庄，后表示内部、里面。","An associative character: 田 (field) over 土 (earth), originally a village, now meaning inside.",""],
  ["兔","tù","C 7-8","兔子","rabbit","小兔子爱吃萝卜。","The little rabbit loves to eat carrots.","象形字，像一只竖着耳朵、有短尾巴的兔子。","A pictograph: it looks like a rabbit with long ears and a short tail.",""],
  ["鸭","yā","C 7-8","鸭子","duck","小鸭子在水里游。","The little duck swims in the water.","形声字，鸟旁表示是鸟类，左边\"甲\"表声。","A phono-semantic character: the bird radical (鸟) shows it's a bird, 甲 gives the sound.",""],
  ["企","qǐ","C 7-8","企鹅","penguin","企鹅生活在很冷的地方。","Penguins live in very cold places.","会意字，上\"人\"下\"止\"(脚)，表示踮起脚盼望。","An associative character: 人 (person) over 止 (foot), meaning to stand on tiptoe and hope.",""],
  ["鹅","é","C 7-8","大鹅","goose","大白鹅嘎嘎叫。","The big white goose goes honk honk.","形声字，鸟旁表示是鸟类，左边\"我\"表声。","A phono-semantic character: the bird radical (鸟) shows it's a bird, 我 gives the sound.",""],
  ["的","de","C 9-10","我的","my / mine","这是我的玩具。","This is my toy.","形声字，白旁表意，右边\"勺\"表声，今多作助词\"的\"。","A phono-semantic character: 白 gives meaning and 勺 the sound; now mostly a possessive particle.","我的的的（de，(possessive)）；目的的的（dì，goal）；的确的的（dí，indeed）"],
  ["玩","wán","C 9-10","玩具","toy","我们在公园里玩。","We play in the park.","形声字，王(玉)旁表意，右边\"元\"表声。","A phono-semantic character: the jade radical (王) gives meaning, 元 gives the sound.",""],
  ["具","jù","C 9-10","工具","tool","玩具都放在盒子里。","The toys are all in the box.","会意字，本像双手捧着器物，表示用具、器具。","An associative character: it shows two hands holding a vessel, meaning a tool or utensil.",""],
  ["汽","qì","C 9-10","汽车","car","汽车在路上跑。","The car runs on the road.","形声字，三点水表示与水气有关，右边\"气\"表声。","A phono-semantic character: the water radical relates to vapor, 气 gives the sound.",""],
  ["车","chē","C 9-10","火车","train","火车开得很快。","The train goes very fast.","象形字，像一辆车，中间是车厢，两边是车轮。","A pictograph: it looks like a cart, with the body in the middle and wheels on the sides.",""],
  ["机","jī","C 9-10","飞机","airplane","飞机在天上飞。","The airplane flies in the sky.","形声字，木旁表示原与木制器械有关，右边\"几\"表声。","A phono-semantic character: the wood radical relates to a machine, 几 gives the sound.",""],
  ["开","kāi","C 9-10","打开","to open","请你打开窗户。","Please open the window.","会意字，像双手把门闩拉开，表示打开。","An associative character: it shows two hands pulling open a door bolt, meaning to open.",""],
  ["心","xīn","C 9-10","开心","happy","今天我很开心。","I am very happy today.","象形字，像人的心脏，表示心、心里。","A pictograph: it looks like a heart, meaning heart or mind.",""],
  ["个","gè","D 1-2","一个","one (item)","我有一个苹果。","I have one apple.","形声字，作量词用，表示单个的人或物。","A common measure word used for counting single people or things.",""],
  ["她","tā","D 1-2","她们","they (female)","她是我的好朋友。","She is my good friend.","形声字，女旁表示是女性，右边\"也\"表声。","A phono-semantic character: the woman radical (女) shows it's female, 也 gives the sound.",""],
  ["看","kàn","D 1-2","看见","to see","我看见一只小鸟。","I see a little bird.","会意字，上\"手\"下\"目\"(眼),像用手遮眼远望。","An associative character: a hand (手) over an eye (目), like shading the eyes to look far.","看见的看（kàn，to see）；看门的看（kān，to guard）"],
  ["书","shū","D 1-2","看书","to read a book","我爱看故事书。","I love reading storybooks.","会意字，本像手拿笔书写，引申为书写、书本。","An associative character: it shows a hand holding a brush to write, later meaning a book.",""],
  ["画","huà","D 1-2","画画","to draw / drawing","我画了一只小猫。","I drew a little cat.","会意字，上面是手拿笔，下面是田界，表示用笔划出界线即作画。","An associative compound: a hand holding a brush above field boundaries, meaning to draw lines, hence \"to paint.\"",""],
  ["漂","piào","D 1-2","漂亮","beautiful / pretty","她的裙子真漂亮。","Her dress is really pretty.","形声字，三点水表意与水有关，右边\"票\"表声。","A phono-semantic compound: the water radical gives the meaning, and \"票\" gives the sound.","漂亮的漂（piào，pretty）；漂浮的漂（piāo，to float）"],
  ["可","kě","D 1-2","可爱","cute / lovable","这只小狗很可爱。","This puppy is very cute.","会意字，从口从丂，本表许可、应允的口气。","An associative compound with a mouth element, originally meaning to approve or permit.",""],
  ["爱","ài","D 1-2","喜爱","to love / to like","我爱我的妈妈。","I love my mom.","会意字，中间有\"心\"，表示心里有爱、疼惜之情。","An associative compound containing a \"heart,\" expressing the feeling of love.",""],
  ["娃","wá","D 1-2","娃娃","baby / doll","妹妹抱着一个娃娃。","Little sister is holding a doll.","形声字，女字旁表意与女孩、小孩有关，右边\"圭\"表声。","A phono-semantic compound: the \"woman\" radical gives the meaning (child/girl), and \"圭\" gives the sound.",""],
  ["公","gōng","D 3-4","公园","park","我们去公园玩。","We go to the park to play.","会意字，上面\"八\"是分开，下面\"厶\"是私，分掉私心即为公。","An associative compound: \"divide\" over \"private,\" meaning to set aside selfishness, hence \"public.\"",""],
  ["园","yuán","D 3-4","花园","garden","花园里开满了花。","The garden is full of blooming flowers.","形声字，外框\"囗\"表意是围起来的地方，里面\"袁\"表声。","A phono-semantic compound: the enclosure gives the meaning (a fenced place), and \"袁\" gives the sound.",""],
  ["站","zhàn","D 3-4","站立","to stand","请你站在这里。","Please stand here.","形声字，立字旁表意与站立有关，右边\"占\"表声。","A phono-semantic compound: the \"stand\" radical gives the meaning, and \"占\" gives the sound.",""],
  ["坐","zuò","D 3-4","坐下","to sit down","小朋友坐在椅子上。","The children sit on the chairs.","会意字，两个人相对坐在土地上，表示坐下。","An associative compound: two people facing each other on the ground, meaning \"to sit.\"",""],
  ["立","lì","D 3-4","立正","to stand at attention","老师让我们立正。","The teacher asks us to stand at attention.","象形字，像一个人站在地面上，表示站立。","A pictograph showing a person standing on the ground, meaning \"to stand.\"",""],
  ["爷","yé","D 3-4","爷爷","grandpa","爷爷在公园里下棋。","Grandpa is playing chess in the park.","形声字，上面\"父\"表意与父辈长辈有关，下面\"卩\"表声。","A phono-semantic compound: the \"father\" element gives the meaning (elder), and the lower part gives the sound.",""],
  ["奶","nǎi","D 3-4","奶奶","grandma","奶奶给我讲故事。","Grandma tells me stories.","形声字，女字旁表意与女性长辈有关，右边\"乃\"表声。","A phono-semantic compound: the \"woman\" radical gives the meaning, and \"乃\" gives the sound.",""],
  ["去","qù","D 3-4","出去","to go out","我要去学校上课。","I'm going to school for class.","会意字，本像人离开洞口，表示离开、前往。","An associative compound originally showing a person leaving a place, meaning \"to go.\"",""],
  ["听","tīng","D 3-4","听话","to listen / to obey","我喜欢听妈妈唱歌。","I like listening to my mom sing.","形声字，口字旁表意与嘴和声音有关，右边\"斤\"表声。","A phono-semantic compound: the \"mouth\" radical relates to sound, and \"斤\" gives the sound.",""],
  ["欢","huān","D 5-6","喜欢","to like","小朋友们玩得很欢。","The children are playing happily.","形声字，右边\"欠\"表意与张口出气有关，左边表声，本指高兴。","A phono-semantic compound: the \"欠\" element relates to expression, conveying the meaning of joy.",""],
  ["迎","yíng","D 5-6","欢迎","to welcome","我们去车站迎接客人。","We go to the station to welcome the guests.","形声字，走之旁表意与行走、迎接有关，右边\"卬\"表声。","A phono-semantic compound: the \"walk\" radical gives the meaning (to go meet), and \"卬\" gives the sound.",""],
  ["请","qǐng","D 5-6","请坐","please sit","请你帮我开门。","Please help me open the door.","形声字，言字旁表意与说话有关，右边\"青\"表声。","A phono-semantic compound: the \"speech\" radical gives the meaning, and \"青\" gives the sound.",""],
  ["进","jìn","D 5-6","进来","to come in","请进来坐一坐。","Please come in and have a seat.","形声字，走之旁表意与行走、前进有关，右边\"井\"表声。","A phono-semantic compound: the \"walk\" radical gives the meaning (to advance), and \"井\" gives the sound.",""],
  ["喝","hē","D 5-6","喝水","to drink water","我每天都喝牛奶。","I drink milk every day.","形声字，口字旁表意与嘴、喝有关，右边\"曷\"表声。","A phono-semantic compound: the \"mouth\" radical gives the meaning (to drink), and \"曷\" gives the sound.","喝水的喝（hē，to drink）；喝彩的喝（hè，to cheer）"],
  ["茶","chá","D 5-6","喝茶","to drink tea","爷爷喜欢喝热茶。","Grandpa likes to drink hot tea.","形声字，草字头表意是一种植物，下面\"余\"表声。","A phono-semantic compound: the \"grass\" radical shows it's a plant, and the lower part gives the sound.",""],
  ["条","tiáo","D 5-6","一条","one (long thing)","河里有一条小鱼。","There is a little fish in the river.","形声字，下面\"木\"表意本指细长树枝，上部表声，引申为量词。","A phono-semantic compound: the \"wood\" element originally meant a thin twig, used as a measure word for long things.",""],
  ["没","méi","D 5-6","没有","to not have","我没有带书包。","I didn't bring my backpack.","形声字，三点水表意本与沉入水中有关，右边表声，引申为没有。","A phono-semantic compound: the water radical originally meant to sink, later meaning \"to not have.\"","没有的没（méi，not have）；沉没的没（mò，to sink）"],
  ["两","liǎng","D 5-6","两个","two (of something)","我有两只小猫。","I have two kittens.","象形字，本像车上一对马具，引申表示成双的数目\"二\"。","A pictograph originally showing a pair of harness pieces, later meaning the number two/a pair.",""],
  ["尾","wěi","D 5-6","尾巴","tail","小狗摇着尾巴。","The puppy wags its tail.","会意字，上为\"尸\"(身体)下为\"毛\"，表示身体后面长毛的尾巴。","A compound character: body on top and hair below, showing the furry tail behind the body.",""],
  ["巴","ba","D 7-8","尾巴","tail","猴子的尾巴很长。","The monkey's tail is very long.","象形字，本像一条大蛇的样子，后多用作\"尾巴\"\"嘴巴\"等词尾。","A pictograph originally depicting a big snake, now often used as a suffix in words like tail and mouth.",""],
  ["点","diǎn","D 7-8","一点","a little bit","天上有一点小星星。","There is a tiny star in the sky.","形声字，下边四点\"灬\"(火)表意，\"占\"表声，本指小黑点。","A phono-semantic character: the fire dots below give the meaning and 占 gives the sound; it means a small dot.",""],
  ["兴","xìng","D 7-8","高兴","happy","今天我很高兴。","I am very happy today.","会意字，像众手一起抬起东西，表示兴起、振奋。","A compound character showing many hands lifting together, meaning to rise up or flourish.","高兴的兴（xìng，happy）；兴奋的兴（xīng，excited）"],
  ["猴","hóu","D 7-8","猴子","monkey","猴子爱吃香蕉。","Monkeys love to eat bananas.","形声字，左边\"犭\"(犬)表示动物，右边\"侯\"表声。","A phono-semantic character: the animal radical gives the meaning and 侯 gives the sound.",""],
  ["长","cháng","D 7-8","长短","length","长颈鹿的脖子很长。","The giraffe's neck is very long.","象形字，本像一个长头发的老人，表示头发长，引申为长、生长。","A pictograph of an old person with long hair, meaning long and to grow.","长短的长（cháng，long）；长大的长（zhǎng，to grow up）"],
  ["松","sōng","D 7-8","松树","pine tree","小松鼠住在松树上。","The little squirrel lives in the pine tree.","形声字，左边\"木\"表意是树，右边\"公\"表声。","A phono-semantic character: the tree radical gives the meaning and 公 gives the sound.",""],
  ["短","duǎn","D 7-8","短短","short","小兔子的尾巴很短。","The little rabbit's tail is very short.","形声字，左边\"矢\"(箭)表意，因古人用箭量短物，\"豆\"表声。","A phono-semantic character: the arrow radical gives meaning (arrows measured short things) and 豆 gives the sound.",""],
  ["伞","sǎn","D 9-10","雨伞","umbrella","下雨了，我打着伞。","It's raining, so I hold an umbrella.","象形字，整个字像一把撑开的伞，上是伞面下是伞柄。","A pictograph that looks like an open umbrella, with the canopy on top and the handle below.",""],
  ["孔","kǒng","D 9-10","孔雀","peacock","孔雀开屏真漂亮。","The peacock spreading its tail is so beautiful.","会意字，由\"子\"和\"乚\"组成，本指婴儿吃奶的小孔，引申为小洞。","A compound character meaning a small hole, originally the opening a baby nurses from.",""],
  ["鸡","jī","D 9-10","小鸡","chick","小鸡叽叽叫。","The little chick goes cheep cheep.","形声字，右边\"鸟\"表意是鸟类，左边\"又\"表声。","A phono-semantic character: the bird radical gives the meaning and the left part gives the sound.",""],
  ["像","xiàng","D 9-10","好像","to seem like","白云像棉花一样。","The white clouds look like cotton.","形声字，左边\"亻\"(人)表意，右边\"象\"表声又表相似。","A phono-semantic character: the person radical gives the meaning and 象 gives the sound and sense of resemblance.",""],

  ["猪","zhū","A 3","小猪","little pig","小猪在睡觉。","The little pig is sleeping.","形声字，反犬旁'犭'表示是动物，'者'表声。","Phono-semantic: the dog radical shows it is an animal, and 'zhě' gives the sound.",""],
  ["再","zài","A 3","再见","goodbye","明天再来玩吧。","Come play again tomorrow.","指事字，本指鱼堆叠起来，表示又一次、第二次。","Indicative: it originally showed stacked fish, meaning 'again' or 'a second time'.",""],
  ["见","jiàn","A 3","看见","to see","我看见一只小鸟。","I see a little bird.","会意字，上面是'目'(眼睛)下面是'人'，表示人用眼睛看见。","Compound: an eye on top of a person, meaning a person sees with eyes.",""],
  ["校","xiào","A 4","学校","school","我喜欢去学校。","I like going to school.","形声字，木旁表示和木头有关，'交'表声。","Phono-semantic: the wood radical relates to wood, and 'jiāo' gives the sound.","学校的校（xiào，school）；校对的校（jiào，to proofread）"],
  ["师","shī","A 4","老师","teacher","老师教我们读书。","The teacher teaches us to read.","会意字，本指军队，后来指传授知识的老师。","Compound: it first meant an army, later a teacher who passes on knowledge.",""],
  ["教","jiāo","A 4","教书","to teach","妈妈教我画画。","Mom teaches me to draw.","会意字，像大人拿着教鞭教孩子学习。","Compound: it shows an adult holding a rod, teaching a child.","教书的教（jiāo，to teach）；教室的教（jiào，classroom）"],
  ["室","shì","A 4","教室","classroom","教室里很安静。","The classroom is very quiet.","形声字，宝盖头'宀'表示和房屋有关，'至'表声。","Phono-semantic: the roof radical relates to buildings, and 'zhì' gives the sound.",""],
  ["写","xiě","A 4","写字","to write","我会写自己的名字。","I can write my own name.","形声字，秃宝盖'冖'表意，下面部分表声。","Phono-semantic: the cover radical gives meaning, the lower part gives the sound.",""],
  ["字","zì","A 4","汉字","Chinese character","这个字我认识。","I know this character.","会意字，宝盖头'宀'是房子，下面'子'是孩子，本指生养，后指文字。","Compound: a roof over a child; it first meant to bear children, later 'characters'.",""],
  ["猫","māo","A 5-6","小猫","kitten","小猫喜欢喝牛奶。","The kitten likes to drink milk.","形声字，反犬旁'犭'表示是动物，'苗'表声。","Phono-semantic: the dog radical shows it is an animal, and 'miáo' gives the sound.",""],
  ["吃","chī","A 5-6","吃饭","to eat","我喜欢吃苹果。","I like to eat apples.","形声字，口旁表示和嘴有关，'乞'表声。","Phono-semantic: the mouth radical relates to the mouth, and 'qǐ' gives the sound.",""],
  ["谢","xiè","A 5-6","谢谢","thank you","谢谢你帮助我。","Thank you for helping me.","形声字，言字旁'讠'表示和说话有关，'射'表声。","Phono-semantic: the speech radical relates to talking, and 'shè' gives the sound.",""],
  ["不","bú","A 5-6","不要","do not","我不喜欢下雨天。","I don't like rainy days.","象形字，像花的萼托，借来表示否定的'不'。","Pictograph: it pictures a flower's base, borrowed to mean 'not'.",""],
  ["骨","gǔ","A 5-6","骨头","bone","小狗在啃骨头。","The puppy is chewing a bone.","象形字，上面像骨头的关节，下面'月'(肉)表示和身体有关。","Pictograph: the top shows a bone joint, the bottom (flesh) relates to the body.",""],
  ["同","tóng","A 5-6","同学","classmate","我和同学一起玩。","I play together with my classmates.","会意字，表示大家口径一致、聚在一起，意为相同。","Compound: it shows people speaking as one, meaning 'same' or 'together'.",""],
  ["种","zhǒng","A 7-8","种子","seed","我们在花园里种花。","We plant flowers in the garden.","形声字，禾木旁表示和庄稼有关，'中'表声。","Phono-semantic: the grain radical relates to crops, and 'zhōng' gives the sound.","种子的种（zhǒng，seed）；种花的种（zhòng，to plant）"],
  ["瓜","guā","A 7-8","西瓜","watermelon","夏天我爱吃西瓜。","In summer I love to eat watermelon.","象形字，中间像果实，两边像藤蔓，画的就是瓜。","Pictograph: the middle is the fruit and the sides are vines, picturing a melon.",""],
  ["豆","dòu","A 7-8","豆子","bean","我喝了一碗豆浆。","I drank a bowl of soy milk.","象形字，本像一种高脚的食器，后来用来指豆子。","Pictograph: it first pictured a tall food vessel, later came to mean 'bean'.",""],
  ["很","hěn","A 7-8","很多","very many","今天天气很好。","The weather is very nice today.","形声字，双人旁'彳'表意，'艮'表声，表示程度深。","Phono-semantic: the step radical gives meaning and 'gèn' gives the sound, meaning 'very'.",""],
  ["它","tā","A 7-8","它们","they (things)","这是我的猫，它很可爱。","This is my cat; it is very cute.","形声字，宝盖头'宀'表意，'匕'表声，用来指动物或东西。","Phono-semantic: the roof radical gives meaning and 'bǐ' gives the sound; it refers to animals or things.",""],
  ["想","xiǎng","A 7-8","想念","to miss (someone)","我很想念我的奶奶。","I really miss my grandma.","形声字，下面的\"心\"是形旁表示与心思有关，上面的\"相\"是声旁表读音。","A phono-semantic character: the bottom \"心\" (heart) gives the meaning (thinking), and \"相\" on top gives the sound.",""],
  ["收","shōu","A 7-8","收好","to put away","请把玩具收好。","Please put away the toys.","形声字，右边的\"攵\"(攴)是形旁表示用手做动作，左边表声。","A phono-semantic character: the right part \"攵\" (a hand action) gives the meaning, the left part gives the sound.",""],
  ["年","nián","A 9-10","过年","to celebrate New Year","过年了，我们吃饺子。","New Year is here, and we eat dumplings.","会意字，古文字像人背着成熟的禾(谷物)，表示一年庄稼成熟一次。","An associative character: the old form shows a person carrying ripe grain, meaning grain ripens once a year.",""],
  ["衣","yī","A 9-10","衣服","clothes","妈妈给我买了新衣服。","Mom bought me new clothes.","象形字，像一件上衣的样子，有领子和两只袖子。","A pictographic character: it looks like a piece of clothing with a collar and two sleeves.",""],
  ["服","fú","A 9-10","衣服","clothes","这件衣服很漂亮。","This piece of clothing is very pretty.","形声字，右边表声，本与穿戴、顺从有关，现常组成\"衣服\"。","A phono-semantic character whose right part gives the sound; it relates to wearing and obeying, and forms the word \"clothes\".",""],
  ["红","hóng","A 9-10","红色","red","红色的花真好看。","The red flowers are so pretty.","形声字，左边的\"纟\"(丝)是形旁表示颜色与丝织品有关，右边\"工\"表声。","A phono-semantic character: the left \"纟\" (silk) gives the meaning (color of cloth), and \"工\" gives the sound.",""],
  ["绿","lǜ","A 9-10","绿色","green","小草是绿色的。","The grass is green.","形声字，左边的\"纟\"(丝)是形旁表示与颜色有关，右边\"录\"表声。","A phono-semantic character: the left \"纟\" (silk) gives the meaning (color), and \"录\" gives the sound.",""],
  ["换","huàn","A 9-10","换衣","to change clothes","天冷了，要换上厚衣服。","It's cold, so we need to change into warm clothes.","形声字，左边的\"扌\"(手)是形旁表示用手做动作，右边表声。","A phono-semantic character: the left \"扌\" (hand) gives the meaning (a hand action), and the right part gives the sound.",""],
  ["季","jì","A 9-10","季节","season","一年有四个季节。","There are four seasons in a year.","会意字，上面是\"禾\"(谷物)下面是\"子\"，本指庄稼按时节生长，引申为季节。","An associative character: \"禾\" (grain) on top and \"子\" below; it originally meant crops growing in seasons, hence \"season\".",""],
  ["夏","xià","A 9-10","夏天","summer","夏天天气很热。","The weather is very hot in summer.","象形字，古文字像一个人的形象，后来表示一年中炎热的夏季。","A pictographic character: the old form shows a person, and it came to mean the hot season, summer.",""],
  ["秋","qiū","A 9-10","秋天","autumn","秋天树叶变黄了。","In autumn the leaves turn yellow.","会意字，由\"禾\"(谷物)和\"火\"组成，表示谷物成熟、天气干燥的秋季。","An associative character: \"禾\" (grain) and \"火\" (fire) together suggest the dry harvest season, autumn.",""],
  ["冬","dōng","A 9-10","冬天","winter","冬天下雪了。","It snows in winter.","会意字，下面两点是\"冰\"(冫)，表示天气寒冷的冬季。","An associative character: the two dots at the bottom mean ice, showing the cold season, winter.",""],
  ["蝌","kē","B 1-2","蝌蚪","tadpole","小蝌蚪在水里游。","The little tadpoles swim in the water.","形声字，左边的\"虫\"是形旁表示是小动物，右边\"科\"表声。","A phono-semantic character: the left \"虫\" (bug) gives the meaning (small creature), and \"科\" gives the sound.",""],
  ["蚪","dǒu","B 1-2","蝌蚪","tadpole","蝌蚪长大变成青蛙。","Tadpoles grow up into frogs.","形声字，左边的\"虫\"是形旁表示是小动物，右边\"斗\"表声。","A phono-semantic character: the left \"虫\" (bug) gives the meaning (small creature), and \"斗\" gives the sound.",""],
  ["蝴","hú","B 1-2","蝴蝶","butterfly","蝴蝶在花园里飞。","The butterfly flies in the garden.","形声字，左边的\"虫\"是形旁表示是昆虫，右边\"胡\"表声。","A phono-semantic character: the left \"虫\" (bug) gives the meaning (insect), and \"胡\" gives the sound.",""],
  ["蝶","dié","B 1-2","蝴蝶","butterfly","我看见一只花蝴蝶。","I saw a colorful butterfly.","形声字，左边的\"虫\"是形旁表示是昆虫，右边\"枼\"表声。","A phono-semantic character: the left \"虫\" (bug) gives the meaning (insect), and \"枼\" gives the sound.",""],
  ["时","shí","B 1-2","时间","time","现在是吃饭的时间。","It is time to eat now.","形声字，左边的\"日\"是形旁表示与时间、太阳有关，右边\"寸\"表声。","A phono-semantic character: the left \"日\" (sun) gives the meaning (time), and \"寸\" gives the sound.",""],
  ["候","hòu","B 1-2","时候","time; moment","睡觉的时候要关灯。","You should turn off the light when sleeping.","形声字，左边的\"亻\"(人)是形旁表示与人有关，本指等候，常组成\"时候\"。","A phono-semantic character: the left \"亻\" (person) gives the meaning; it originally meant to wait, and forms the word \"time/moment\".",""],
  ["王","wáng","B 1-2","国王","king","故事里有一位国王。","There is a king in the story.","象形字，古文字像一把大斧头，是权力的象征，表示君王。","A pictographic character: the old form looks like a big axe, a symbol of power, meaning king.",""],
  ["林","lín","B 1-2","树林","woods; forest","小鸟在树林里唱歌。","The birds sing in the woods.","会意字，两个\"木\"(树)并在一起，表示很多树就是树林。","An associative character: two \"木\" (trees) side by side mean many trees, a forest.",""],
  ["李","lǐ","B 1-2","李子","plum","这棵树上结满了李子。","This tree is full of plums.","会意兼形声字，上面\"木\"(树)是形旁表示树木，下面\"子\"表声，本指李树。","A character combining meaning and sound: \"木\" (tree) on top gives the meaning, and \"子\" below gives the sound; it means the plum tree.",""],
  ["名","míng","B 1-2","名字","name","请问你叫什么名字？","May I ask what your name is?","会意字，由\"夕\"(晚上)和\"口\"组成，天黑看不见就用口说出名字。","An associative character: \"夕\" (evening) and \"口\" (mouth) together show that in the dark you say your name aloud.",""],
  ["毛","máo","B 1-2","羽毛","feather","小鸟身上有漂亮的羽毛。","The little bird has beautiful feathers.","象形字，像鸟兽身上的一束毛发。","A pictograph depicting a tuft of fur or feathers on an animal.",""],
  ["晶","jīng","B 3","晶亮","sparkling","露珠在叶子上晶亮晶亮。","The dewdrops sparkle on the leaves.","会意字，三个日叠在一起，表示明亮闪光。","An ideograph of three suns stacked, meaning bright and sparkling.",""],
  ["东","dōng","B 3","东边","the east","太阳从东边升起来了。","The sun rises in the east.","指事字，繁体像太阳从树木中升起，指东方。","In its old form, the sun rising behind a tree pointed to the east.",""],
  ["西","xī","B 3","西边","the west","太阳从西边落下去了。","The sun sets in the west.","象形字，像鸟归巢的样子，日落鸟归西方，借表西。","A pictograph of a bird in its nest; as birds roost at sunset, it came to mean west.",""],
  ["南","nán","B 3","南方","the south","大雁冬天飞到南方去。","Wild geese fly to the south in winter.","象形字，古时像一种乐器，后借用来表示南方。","Originally a pictograph of an instrument, later borrowed to mean south.",""],
  ["北","běi","B 3","北方","the north","北方的冬天很冷很冷。","Winter in the north is very cold.","会意字，像两人背对背，本义是背，借表北方。","An ideograph of two people back-to-back; originally 'back,' later borrowed for north.",""],
  ["清","qīng","B 3","清水","clear water","小河里的水清清的。","The water in the little river is clear.","形声字，三点水表意与水有关，青表声。","A phono-semantic character: the water radical gives the meaning, 青 gives the sound.",""],
  ["数","shǔ","B 3","数数","to count","妹妹会数到一百了。","Little sister can count to one hundred.","形声字，反文旁(攵)表与动作有关，娄表声。","A phono-semantic character: the 攵 radical hints at an action, 娄 gives the sound.","数数的数（shǔ，to count）；数学的数（shù，math）"],
  ["过","guò","B 4-5","过桥","to cross a bridge","我们一起过马路吧。","Let's cross the road together.","形声字，走之旁表与行走有关，咼表声。","A phono-semantic character: the walking radical gives the meaning, 咼 the sound.",""],
  ["路","lù","B 4-5","马路","road","这条路通到我家。","This road leads to my home.","形声字，足字旁表与脚和走路有关，各表声。","A phono-semantic character: the foot radical relates to walking, 各 gives the sound.",""],
  ["左","zuǒ","B 4-5","左手","left hand","我用左手画画。","I draw with my left hand.","会意字，像一只左手扶着工具，表示左边。","An ideograph of a left hand holding a tool, meaning the left side.",""],
  ["边","biān","B 4-5","旁边","beside","小猫坐在我旁边。","The kitten sits beside me.","形声字，走之旁表与走动、方位有关，表声部表声。","A phono-semantic character: the walking radical relates to direction, the rest gives the sound.",""],
  ["右","yòu","B 4-5","右手","right hand","请举起你的右手。","Please raise your right hand.","会意字，像一只右手加口，表示右边。","An ideograph of a right hand with 口, meaning the right side.",""],
  ["前","qián","B 4-5","前面","front","老师站在前面讲课。","The teacher stands in front and teaches.","会意字，本像脚在船上向前行，表示前进、前面。","An ideograph showing a foot on a boat moving forward, meaning front or ahead.",""],
  ["后","hòu","B 4-5","后面","behind","小弟弟躲在门后面。","Little brother hides behind the door.","会意字，本表落在后面、走在后头，引申为后面。","An ideograph meaning to lag behind, extended to mean 'behind' or 'back.'",""],
  ["停","tíng","B 4-5","停车","to park / stop a car","汽车在红灯前停下来。","The car stops at the red light.","形声字，单人旁表与人有关，亭表声。","A phono-semantic character: the person radical gives the meaning, 亭 the sound.",""],
  ["慢","màn","B 4-5","慢慢","slowly","乌龟慢慢地往前爬。","The turtle slowly crawls forward.","形声字，竖心旁表与心情、状态有关，曼表声。","A phono-semantic character: the heart radical relates to state of mind, 曼 gives the sound.",""],
  ["丁","dīng","B 6-7","丁丁","Dingding (a name)","丁丁是我的好朋友。","Dingding is my good friend.","象形字，像一颗钉子的样子，是'钉'的本字。","A pictograph of a nail; it is the original form of the character for nail.",""],
  ["胖","pàng","B 6-7","胖胖","chubby","小宝宝的脸胖胖的。","The baby has a chubby little face.","形声字，月(肉)旁表与身体有关，半表声。","A phono-semantic character: the flesh radical relates to the body, 半 gives the sound.",""],
  ["眼","yǎn","B 6-7","眼睛","eye","她有一双大眼睛。","She has a pair of big eyes.","形声字，目字旁表与眼睛有关，艮表声。","A phono-semantic character: the eye radical gives the meaning, 艮 the sound.",""],
  ["睛","jīng","B 6-7","眼睛","eye","请闭上你的眼睛。","Please close your eyes.","形声字，目字旁表与眼睛有关，青表声。","A phono-semantic character: the eye radical gives the meaning, 青 the sound.",""],
  ["鼻","bí","B 6-7","鼻子","nose","大象的鼻子真长。","The elephant's nose is really long.","形声字，自(本像鼻子)表意，畀表声。","A phono-semantic character: 自 (originally a nose) gives the meaning, 畀 the sound.",""],
  ["嘴","zuǐ","B 6-7","嘴巴","mouth","妹妹的嘴巴红红的。","Little sister's mouth is red.","形声字，口字旁表意（与嘴有关），右边\"觜\"表声。","A phono-semantic character: the 'mouth' radical gives the meaning, the right part gives the sound.",""],
  ["发","fà","B 6-7","头发","hair","妈妈的头发很长。","Mom's hair is very long.","会意字，本指张弓射箭，引申为发出、生长（如头发）。","An associative character originally meaning shooting an arrow, later extended to 'send out' and 'hair'.","出发的发（fā，to set off）；头发的发（fà，hair）"],
  ["朵","duǒ","B 6-7","花朵","flower","花园里有一朵红花。","There is a red flower in the garden.","象形字，像树枝上垂着的花果之形，用作花的量词。","A pictographic character depicting flowers or fruit hanging on a branch; used as a measure word for flowers.",""],
  ["脸","liǎn","B 6-7","洗脸","to wash face","早上我自己洗脸。","In the morning I wash my face myself.","形声字，月（肉）旁表意（与身体有关），右边\"佥\"表声。","A phono-semantic character: the 'flesh' radical gives the body-related meaning, the right part gives the sound.",""],
  ["尖","jiān","B 8","尖尖","pointed","铅笔的头尖尖的。","The tip of the pencil is pointed.","会意字，上小下大，表示物体顶端又细又尖。","An associative character: 'small' on top of 'big' shows a thin, pointed tip.",""],
  ["就","jiù","B 8","就是","exactly is","我吃完饭就去睡觉。","I go to sleep right after I finish eating.","会意字，从京从尤，本义为靠近、到高处去，引申为立刻。","An associative character originally meaning to approach a high place, later extended to 'right away'.",""],
  ["只","zhī","B 8","一只","one (animal)","树上有一只小鸟。","There is a little bird in the tree.","指事字，下部口加两点，表语气；后借作量词和\"仅\"义。","An indicative character later borrowed as a measure word and to mean 'only'.","一只的只（zhī，(measure word)）；只有的只（zhǐ，only）"],
  ["问","wèn","B 8","问好","to greet","不会的题就问老师。","Ask the teacher about questions you don't understand.","形声字，口字表意（用嘴询问），门字表声。","A phono-semantic character: 'mouth' gives the meaning of asking, 'door' gives the sound.",""],
  ["对","duì","B 8","对的","correct","你说得很对。","What you said is very correct.","会意字，本表应答，引申为正确、相对。","An associative character originally meaning to respond, later extended to 'correct' and 'facing'.",""],
  ["在","zài","B 8","在家","at home","小猫在床下睡觉。","The kitten is sleeping under the bed.","形声字，土字表意（与处所有关），\"才\"表声，表示存在、处于。","A phono-semantic character: 'earth' relates to place, the rest gives the sound; means 'to exist/be at'.",""],
  ["城","chéng","B 9-10","城市","city","我们住在大城市里。","We live in a big city.","形声字，土字旁表意（城墙用土筑），\"成\"表声。","A phono-semantic character: the 'earth' radical shows walls built of earth, the right part gives the sound.",""],
  ["背","bēi","B 9-10","背包","backpack","我背着书包去上学。","I carry my schoolbag on my back to school.","形声字，月（肉）旁表意（身体部位），\"北\"表声，本指脊背。","A phono-semantic character: the 'flesh' radical shows a body part, the top gives the sound; means 'back'.","背包的背（bēi，to carry / backpack）；后背的背（bèi，the back）"],
  ["包","bāo","B 9-10","书包","schoolbag","我的书包里有铅笔。","There are pencils in my schoolbag.","象形字，像用东西把里面的物品裹起来之形。","A pictographic character depicting something wrapped up inside.",""],
  ["原","yuán","B 9-10","草原","grassland","草原上有许多牛羊。","There are many cattle and sheep on the grassland.","会意字，厂下泉水流出，本指水源，引申为平坦的原野。","An associative character showing a spring under a cliff; originally 'source', later 'plain'.",""],
  ["骑","qí","B 9-10","骑马","to ride a horse","哥哥骑自行车上学。","Big brother rides a bike to school.","形声字，马字旁表意（与马有关），\"奇\"表声。","A phono-semantic character: the 'horse' radical gives the meaning, the right part gives the sound.",""],
  ["乡","xiāng","B 9-10","家乡","hometown","我的家乡很美。","My hometown is very beautiful.","会意字，本像两人相对就食，引申为乡里、家乡。","An associative character originally showing people sharing a meal, later meaning 'village/hometown'.",""],
  ["船","chuán","B 9-10","小船","small boat","湖上有一只小船。","There is a little boat on the lake.","形声字，舟字旁表意（与船有关），右边\"㕣\"表声。","A phono-semantic character: the 'boat' radical gives the meaning, the right part gives the sound.",""],
  ["今","jīn","C 1-2","今天","today","今天天气真好。","The weather is really nice today.","指事字，表示\"现在、当下\"的时间概念。","An indicative character expressing the idea of 'now, the present'.",""],
  ["班","bān","C 1-2","班级","class","我们班有二十个人。","There are twenty people in our class.","会意字，两个\"玉\"中间一刀，本指分玉，引申为分组、班级。","An associative character showing a knife splitting jade; means to divide, hence 'class/group'.",""],
  ["级","jí","C 1-2","年级","grade","我上一年级了。","I am in first grade now.","形声字，绞丝旁表意（本指丝线等级），\"及\"表声。","A phono-semantic character: the 'silk' radical gives the meaning, the right part gives the sound.",""],
  ["泼","pō","C 1-2","活泼","lively","小妹妹很活泼。","Little sister is very lively.","形声字，三点水表意（与水有关），\"发\"表声，本指洒水。","A phono-semantic character: the 'water' radical gives the meaning, the right part gives the sound; means to splash.",""],
  ["给","gěi","C 1-2","给你","give you","妈妈给我一块糖。","Mom gave me a piece of candy.","形声字，绞丝旁表意（本指供给丝物），\"合\"表声。","A phono-semantic character: the 'silk' radical gives the meaning, the right part gives the sound.","给你的给（gěi，to give）；供给的给（jǐ，to supply）"],
  ["新","xīn","C 1-2","新年","New Year","我有一个新书包。","I have a new schoolbag.","形声字，斤(斧头)表意、辛表声，本指用斧头砍柴，后表示新的。","A phono-semantic character; 斤 (axe) gives the meaning and 辛 gives the sound; it originally meant cutting wood, later 'new'.",""],
  ["作","zuò","C 1-2","作业","homework","我在写数学作业。","I am doing my math homework.","形声字，亻(人)表意、乍表声，表示人做事、制作。","A phono-semantic character; the person radical 亻 gives the meaning and 乍 gives the sound, meaning to do or make.",""],
  ["业","yè","C 1-2","作业","homework","今天的作业不多。","There isn't much homework today.","象形字，本像古代挂乐器的木架，后引申为事业、学业。","A pictographic character originally depicting a wooden rack for hanging musical instruments, later meaning work or studies.",""],
  ["龙","lóng","C 1-2","小龙","little dragon","我画了一条大龙。","I drew a big dragon.","象形字，像传说中长身、有角、能飞的龙的样子。","A pictographic character depicting the legendary long-bodied, horned, flying dragon.",""],
  ["期","qī","C 3-4","星期","week","星期天我们去公园。","On Sunday we go to the park.","形声字，月表意、其表声，本指约定的时间，如一个月。","A phono-semantic character; 月 (moon/month) gives the meaning and 其 gives the sound, meaning an appointed time or period.",""],
  ["领","lǐng","C 3-4","带领","to lead","老师带领我们做操。","The teacher leads us in exercises.","形声字，页(头)表意、令表声，本指脖子，后引申为带领。","A phono-semantic character; 页 (head) gives the meaning and 令 gives the sound; it originally meant 'neck', later 'to lead'.",""],
  ["泳","yǒng","C 3-4","游泳","to swim","夏天我喜欢去游泳。","In summer I like to go swimming.","形声字，氵(水)表意、永表声，表示在水里游。","A phono-semantic character; the water radical 氵 gives the meaning and 永 gives the sound, meaning to swim in water.",""],
  ["唱","chàng","C 3-4","唱歌","to sing","妹妹在唱一首歌。","My little sister is singing a song.","形声字，口表意、昌表声，用嘴发出歌声。","A phono-semantic character; 口 (mouth) gives the meaning and 昌 gives the sound, meaning to sing with the mouth.",""],
  ["歌","gē","C 3-4","儿歌","children's song","我会唱很多儿歌。","I can sing many children's songs.","形声字，欠(张口出气)表意、哥表声，表示开口唱歌。","A phono-semantic character; 欠 (open mouth breathing out) gives the meaning and 哥 gives the sound, meaning to sing.",""],
  ["捉","zhuō","C 3-4","捉迷藏","hide-and-seek","小猫在捉一只老鼠。","The kitten is catching a mouse.","形声字，扌(手)表意、足表声，表示用手抓住。","A phono-semantic character; the hand radical 扌 gives the meaning and 足 gives the sound, meaning to catch with the hand.",""],
  ["休","xiū","C 3-4","休息","to rest","累了就坐下来休息。","When tired, sit down and rest.","会意字，一个人(亻)靠在树(木)旁，表示休息。","An associative character: a person 亻 leaning against a tree 木, meaning to rest.",""],
  ["息","xī","C 3-4","休息","to rest","下课了，我们休息一会儿。","Class is over, let's rest a while.","会意字，自(鼻子)加心，表示呼吸、气息，引申为休息。","An associative character: 自 (nose) plus 心 (heart), meaning breath, extended to mean rest.",""],
  ["又","yòu","C 5-6","又大又圆","big and round","月亮又大又圆。","The moon is big and round.","象形字，像一只右手的样子，后多用来表示再一次。","A pictographic character depicting a right hand, later mostly used to mean 'again'.",""],
  ["圆","yuán","C 5-6","圆形","circle","皮球是圆圆的。","The ball is round.","形声字，囗(围)表意、员表声，表示圆形的东西。","A phono-semantic character; the enclosure 囗 gives the meaning and 员 gives the sound, meaning round.",""],
  ["节","jié","C 5-6","节日","festival","中秋节我们吃月饼。","At the Mid-Autumn Festival we eat mooncakes.","形声字，艹(竹)表意、即(卩)表声，本指竹节，引申为节日。","A phono-semantic character; the bamboo-related top gives the meaning and the lower part gives the sound; it originally meant bamboo joint, later 'festival'.",""],
  ["全","quán","C 5-6","全家","whole family","我们全家一起吃饭。","Our whole family eats together.","会意字，从入从玉，表示完整无缺的好玉，引申为齐全、完全。","An associative character combining 入 and 玉 (jade), meaning a flawless whole, extended to mean complete or entire.",""],
  ["饼","bǐng","C 5-6","月饼","mooncake","奶奶做的饼很好吃。","The cakes Grandma makes are delicious.","形声字，饣(食)表意、并表声，表示用面做的扁圆食物。","A phono-semantic character; the food radical 饣 gives the meaning and 并 gives the sound, meaning a flat round cake.",""],
  ["什","shén","C 5-6","什么","what","你想吃什么。","What do you want to eat?","形声字，亻(人)表意、十表声，在\"什么\"中读shén。","A phono-semantic character; the person radical 亻 gives the meaning and 十 gives the sound; read shén in 什么 (what).",""],
  ["么","me","C 5-6","什么","what","这是什么东西。","What is this thing?","形声字，本是\"麼\"的简体，作语气词时读轻声me。","A simplified form of 麼; as a grammatical particle it is read in the neutral tone 'me'.",""],
  ["喜","xǐ","C 5-6","喜欢","to like","我喜欢吃苹果。","I like to eat apples.","会意字，上面是鼓(壴)、下面是口，表示敲鼓欢笑、高兴。","An associative character: a drum on top and 口 (mouth) below, meaning drumming and laughing with joy.",""],
  ["欢","huān","C 5-6","欢乐","joyful","小朋友们玩得很欢。","The children are playing happily.","形声字，欠(张口)表意、又(原声旁)表声，表示开口欢笑、高兴。","A phono-semantic character; 欠 (open mouth) gives the meaning, meaning to be joyful and happy.",""],
  ["乐","lè","C 5-6","快乐","happy","生日快乐，祝你天天开心。","Happy birthday, may you be happy every day.","象形字，本像架子上的乐器，读yuè指音乐，读lè指快乐。","A pictographic character originally depicting a musical instrument on a stand; read yuè it means music, read lè it means happy.","快乐的乐（lè，happy）；音乐的乐（yuè，music）"],
  ["肉","ròu","C 7-8","牛肉","beef","我喜欢吃妈妈做的肉。","I like to eat the meat my mom makes.","象形字，像一块切开的肉，里面的纹路是肉的纹理。","A pictograph resembling a slice of meat, with the lines showing the muscle texture.",""],
  ["把","bǎ","C 7-8","一把","a handful / a (measure word)","请把门关上。","Please close the door.","形声字，提手旁表示和手有关，“巴”表声。","A phono-semantic character: the hand radical shows it relates to the hand, and \"巴\" gives the sound.",""],
  ["要","yào","C 7-8","想要","to want","我要喝一杯水。","I want to drink a cup of water.","会意字，本像人用双手叉在腰上，是“腰”的本字，后借用表示需要。","An associative character originally showing hands on the waist (the original form of 腰), later borrowed to mean \"want.\"","想要的要（yào，to want）；要求的要（yāo，to demand）"],
  ["桃","táo","C 7-8","桃子","peach","夏天的桃子又甜又香。","Summer peaches are sweet and fragrant.","形声字，木字旁表示是树木，“兆”表声。","A phono-semantic character: the tree radical shows it is a tree, and \"兆\" gives the sound.",""],
  ["蚊","wén","C 7-8","蚊子","mosquito","夏天的晚上蚊子很多。","There are many mosquitoes on summer nights.","形声字，虫字旁表示是昆虫，“文”表声。","A phono-semantic character: the insect radical shows it is a bug, and \"文\" gives the sound.",""],
  ["真","zhēn","C 7-8","真的","real / true","这朵花真漂亮。","This flower is really beautiful.","会意字，本指道家修真，后表示真实、不假。","An associative character originally about Daoist cultivation, later meaning \"true, real.\"",""],
  ["完","wán","C 7-8","完成","to finish","我把饭吃完了。","I finished eating my meal.","形声字，宝盖头表示与房屋完整有关，“元”表声。","A phono-semantic character: the roof radical relates to wholeness, and \"元\" gives the sound.",""],
  ["斑","bān","C 9-10","斑马","zebra","斑马身上有黑白条纹。","A zebra has black and white stripes on its body.","会意字，两个“玉”中间夹个“文”，表示色彩交错的花纹。","An associative character with \"文\" between two \"玉,\" showing intermingled colored patterns.",""],
  ["苹","píng","C 9-10","苹果","apple","红红的苹果挂在树上。","Red apples hang on the tree.","形声字，草字头表示与植物有关，“平”表声。","A phono-semantic character: the grass radical relates to plants, and \"平\" gives the sound.",""],
  ["果","guǒ","C 9-10","水果","fruit","树上结了好多果子。","The tree has grown lots of fruit.","象形字，上面是树上结的果实，下面是“木”，表示树木结果。","A pictograph showing fruit on top and a tree (木) below, depicting fruit growing on a tree.",""],
  ["香","xiāng","C 9-10","香味","fragrance","厨房里飘出饭菜的香味。","The smell of food drifts out of the kitchen.","会意字，上面是“禾”（庄稼），下面是“日”（甘），表示谷物的香气。","An associative character with grain (禾) above and sweetness below, showing the aroma of grain.",""],
  ["蕉","jiāo","C 9-10","香蕉","banana","小猴子最爱吃香蕉。","Little monkeys love to eat bananas the most.","形声字，草字头表示与植物有关，“焦”表声。","A phono-semantic character: the grass radical relates to plants, and \"焦\" gives the sound.",""],
  ["身","shēn","C 9-10","身体","body","多运动身体才健康。","Exercise more to keep your body healthy.","象形字，像一个人挺着身子的样子，表示身体。","A pictograph of a person standing with the body upright, meaning \"body.\"",""],
  ["会","huì","C 9-10","会说","can speak / able to","我会自己穿衣服了。","I can put on my own clothes now.","会意字，本表示器物的盖子相合，引申为聚合、能够。","An associative character originally showing a lid fitting a vessel, extended to mean \"gather\" and \"be able to.\"","开会的会（huì，meeting）；会计的会（kuài，accountant）"],
  ["知","zhī","C 9-10","知道","to know","我知道你的名字。","I know your name.","会意字，由“矢”（箭）和“口”组成，说话像箭一样快、准，表示知晓。","An associative character of arrow (矢) and mouth (口): speaking fast and true like an arrow, meaning \"to know.\"",""],
  ["道","dào","C 9-10","道路","road","知道答案的请举手。","Please raise your hand if you know the answer.","会意字，走之旁表示行走，“首”是头，合起来表示人走的路。","An associative character: the walk radical plus head (首) together depict the road people walk on.",""],
  ["聪","cōng","C 9-10","聪明","smart / clever","这个孩子很聪明。","This child is very clever.","形声字，耳字旁表示与听觉有关，“总”表声，本指听觉灵敏。","A phono-semantic character: the ear radical relates to hearing, \"总\" gives the sound; originally meaning sharp hearing.",""],
  ["明","míng","C 9-10","明天","tomorrow","天亮了，屋子很明亮。","Day has broken, and the room is bright.","会意字，由“日”和“月”组成，日月发光，表示明亮。","An associative character of sun (日) and moon (月) giving light, meaning \"bright.\"",""],
  ["颜","yán","D 1-2","颜色","color","我喜欢蓝色这种颜色。","I like the color blue.","形声字，“页”表示与头脸有关，“彦”表声，本指两眉之间。","A phono-semantic character: \"页\" relates to the face, \"彦\" gives the sound; originally meaning the area between the brows.",""],
  ["色","sè","D 1-2","红色","red (color)","彩虹有七种颜色。","A rainbow has seven colors.","会意字，本指脸上的神色，后引申为颜色。","An associative character originally meaning facial expression, later extended to mean \"color.\"",""],
  ["刷","shuā","D 1-2","刷牙","to brush teeth","每天早上我都刷牙。","I brush my teeth every morning.","形声字，立刀旁表示与刀刮、清洁有关，左边表声。","A phono-semantic character: the knife radical relates to scraping and cleaning, the left part gives the sound.",""],
  ["黄","huáng","D 1-2","黄色","yellow","秋天的树叶变黄了。","The leaves turn yellow in autumn.","象形字，古时像佩玉的样子，后用来表示黄色。","A pictograph originally depicting a jade ornament, later used to mean the color yellow.",""],
  ["蓝","lán","D 1-2","蓝色","blue","天空是蓝色的。","The sky is blue.","形声字，草字头表意（本指可染蓝的草），监表声。","A phono-semantic character: the grass radical gives the meaning (a dye plant) and 监 gives the sound.",""],
  ["彩","cǎi","D 1-2","彩色","colorful","我画了一幅彩色的画。","I drew a colorful picture.","形声字，三撇（彡）表意指花纹色彩，采表声。","A phono-semantic character: 彡 (lines) gives the meaning of patterns and color, and 采 gives the sound.",""],
  ["虹","hóng","D 1-2","彩虹","rainbow","雨后天上有彩虹。","There is a rainbow in the sky after the rain.","形声字，虫字旁表意（古人以为虹像龙虫），工表声。","A phono-semantic character: the insect radical gives the meaning (ancients saw it as a dragon-like creature) and 工 gives the sound.",""],
  ["落","luò","D 3-4","落下","to fall down","树叶慢慢落下来。","The leaves slowly fall down.","形声字，草字头表意（草木凋落），洛表声。","A phono-semantic character: the grass radical gives the meaning (plants withering and falling) and 洛 gives the sound.",""],
  ["叶","yè","D 3-4","树叶","leaf","秋天的树叶变黄了。","The leaves turn yellow in autumn.","形声字，口字旁表意，十表声。","A phono-semantic character: the mouth radical gives the meaning and 十 gives the sound.",""],
  ["气","qì","D 3-4","空气","air","早上的空气很新鲜。","The morning air is very fresh.","象形字，像云气飘动的样子。","A pictographic character depicting drifting clouds or vapor.",""],
  ["凉","liáng","D 3-4","凉快","cool","树下很凉快。","It is cool under the tree.","形声字，两点水表意（与冷有关），京表声。","A phono-semantic character: the ice radical gives the meaning (related to cold) and 京 gives the sound.",""],
  ["片","piàn","D 3-4","一片","a piece","我吃了一片面包。","I ate a piece of bread.","指事字，像把木头剖成两半的一半，表示薄片。","An indicative character showing half of a split piece of wood, meaning a thin slice.",""],
  ["面","miàn","D 3-4","面条","noodles","妈妈做了一碗面条。","Mom made a bowl of noodles.","象形字，像人的脸的轮廓，本义是脸。","A pictographic character depicting the outline of a human face; its original meaning is face.",""],
  ["河","hé","D 3-4","小河","river","小河里有许多小鱼。","There are many little fish in the river.","形声字，三点水表意（与水有关），可表声。","A phono-semantic character: the water radical gives the meaning and 可 gives the sound.",""],
  ["蚂","mǎ","D 3-4","蚂蚁","ant","一群蚂蚁在搬东西。","A group of ants is carrying things.","形声字，虫字旁表意（是小虫），马表声。","A phono-semantic character: the insect radical gives the meaning and 马 gives the sound.",""],
  ["蚁","yǐ","D 3-4","蚂蚁","ant","蚂蚁爱吃甜甜的糖。","Ants love to eat sweet sugar.","形声字，虫字旁表意（是小虫），义表声。","A phono-semantic character: the insect radical gives the meaning and 义 gives the sound.",""],
  ["信","xìn","D 3-4","写信","to write a letter","我给爷爷写了一封信。","I wrote a letter to my grandpa.","会意字，人加言，表示人说话要讲信用、真实。","An associative character: person plus speech, meaning a person's words should be truthful and trustworthy.",""],
  ["方","fāng","D 3-4","方块","square","桌子是方方的。","The table is square.","象形字，本像并在一起的两条船，后多指方形、方向。","A pictographic character originally showing two boats side by side; later it means square or direction.",""],
  ["块","kuài","D 5-6","一块","a piece","我想吃一块蛋糕。","I want to eat a piece of cake.","形声字，土字旁表意（本指土块），夬表声。","A phono-semantic character: the earth radical gives the meaning (a lump of earth) and 夬 gives the sound.",""],
  ["放","fàng","D 5-6","放下","to put down","请把书包放下。","Please put down your backpack.","形声字，反文旁（攵）表意（与动作有关），方表声。","A phono-semantic character: the 攵 radical gives the meaning (an action) and 方 gives the sound.",""],
  ["盆","pén","D 5-6","花盆","flowerpot","窗台上放着一个花盆。","There is a flowerpot on the windowsill.","形声字，皿字底表意（是器皿），分表声。","A phono-semantic character: the vessel radical gives the meaning (a container) and 分 gives the sound.",""],
  ["等","děng","D 5-6","等待","to wait","我在门口等妈妈。","I am waiting for Mom at the door.","会意字，竹字头加寺，本指整理竹简，引申为等同、等待。","An associative character: bamboo plus 寺, originally sorting bamboo slips, later meaning equal or to wait.",""],
  ["到","dào","D 5-6","到达","to arrive","我们到学校了。","We have arrived at school.","形声字，至表意（表示到达），刂（刀）表声。","A phono-semantic character: 至 gives the meaning (to reach) and 刂 gives the sound.",""],
  ["哪","nǎ","D 5-6","哪里","where","你的家在哪里？","Where is your home?","形声字，口字旁表意（是疑问语气词），那表声。","A phono-semantic character: the mouth radical gives the meaning (a question word) and 那 gives the sound.",""],
  ["出","chū","D 5-6","出去","to go out","我们一起出去玩吧。","Let's go out and play together.","会意字，像脚从洞穴中向外走，表示出来。","An associative character showing a foot stepping out of a cave, meaning to go out.",""],
  ["肚","dù","D 5-6","肚子","belly","我的肚子有点饿了。","My belly is a little hungry.","形声字，月（肉）字旁表意（与身体有关），土表声。","A phono-semantic character: the flesh radical gives the meaning (a body part) and 土 gives the sound.",""],
  ["洞","dòng","D 5-6","山洞","cave","小熊住在山洞里。","The little bear lives in a cave.","形声字，三点水表意，表示与水冲刷出的空洞有关，右边\"同\"表声。","A phono-semantic character: the water radical gives the meaning, and 'tong' on the right gives the sound.",""],
  ["抱","bào","D 7-8","拥抱","to hug","妈妈轻轻抱着我。","Mom gently holds me in her arms.","形声字，提手旁表意，表示用手臂围住，右边\"包\"表声。","A phono-semantic character: the hand radical shows meaning (to wrap in arms), and 'bao' gives the sound.",""],
  ["远","yuǎn","D 7-8","远方","far away","奶奶家离这里很远。","Grandma's home is very far from here.","形声字，走之旁表意，表示路途，右边\"元\"表声。","A phono-semantic character: the walk radical shows the meaning of distance, and 'yuan' gives the sound.",""],
  ["半","bàn","D 7-8","一半","half","我把苹果分成两半。","I cut the apple into two halves.","会意字，把\"八\"(分开)放在\"牛\"上，表示把东西从中间分成两份。","An associative character: splitting an ox in the middle shows the idea of dividing into halves.",""],
