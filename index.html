  ["经","jīng","B 2-3","已经","already","我经过了一座小桥。","I passed by a little bridge.","形声字，绞丝旁表意(本指织布的直线)，巠字表声。","A phono-semantic character: the 'silk' radical shows meaning (the warp threads in weaving), '巠' gives the sound.",""],
  ["位","wèi","B 2-3","座位","seat","请坐到你的位子上。","Please sit in your seat.","会意字，单人旁加'立'，表示人站立的地方，即位置。","An ideogram: 'person' plus 'stand', meaning the place where a person stands, a position.",""],
  ["桥","qiáo","B 4-5","小桥","little bridge","小河上有一座木桥。","There is a wooden bridge over the little river.","形声字，木字旁表意(古时桥多用木造)，乔字表声。","A phono-semantic character: the 'wood' radical shows meaning (bridges were made of wood), '乔' gives the sound.",""],
  ["壶","hú","B 4-5","茶壶","teapot","奶奶用茶壶泡茶。","Grandma makes tea with the teapot.","象形字，像一个有盖、有把、鼓肚子的壶。","A pictograph shaped like a pot with a lid, handle, and round belly.",""],
  ["梳","shū","B 4-5","梳头","to comb hair","妈妈给我梳头发。","Mom combs my hair.","形声字，木字旁表意(梳子常用木做)，㐬字表声。","A phono-semantic character: the 'wood' radical shows meaning (combs are made of wood), '㐬' gives the sound.",""],
  ["镜","jìng","B 4-5","镜子","mirror","我在镜子里看见自己。","I see myself in the mirror.","形声字，金字旁表意(古镜用铜等金属磨成)，竟字表声。","A phono-semantic character: the 'metal' radical shows meaning (mirrors were made of metal), '竟' gives the sound.",""],
  ["系","jì","B 4-5","系鞋带","to tie shoelaces","我学会了系鞋带。","I learned how to tie my shoelaces.","会意字，上面是手，下面是丝，表示用手把丝绳打结、连系。","An ideogram: a hand above silk threads, meaning to tie or fasten with cords.","系鞋带的系（jì，to tie）；关系的系（xì，relation）"],
  ["荡","dàng","B 4-5","荡秋千","to swing","我们在公园里荡秋千。","We swing on the swings in the park.","形声字，草字头表意(原与水草、水流摇动有关)，汤字表声。","A phono-semantic character: the 'grass' radical shows meaning (swaying water plants), '汤' gives the sound.",""],
  ["莹","yíng","B 6-7","晶莹","sparkling and clear","露珠晶莹得像珍珠。","The dewdrops sparkle like pearls.","形声字，玉字底表意(像玉一样光洁)，荧省笔表声。","A phono-semantic character: the 'jade' radical shows meaning (clear like jade), the top gives the sound.",""],
  ["灿","càn","B 6-7","灿烂","brilliant","她笑得很灿烂。","She smiled brightly.","形声字，火字旁表意(与光亮有关)，山字表声。","A phono-semantic character: the 'fire' radical shows meaning (related to brightness), '山' gives the sound.",""],
  ["忙","máng","B 6-7","帮忙","to help","妈妈很忙，我来帮忙。","Mom is busy, so I help out.","形声字，竖心旁表意(与心情有关，心里事多)，亡字表声。","A phono-semantic character: the 'heart' radical shows meaning (a heart full of things to do), '亡' gives the sound.",""],
  ["伙","huǒ","B 6-7","伙伴","companion","他是我的好伙伴。","He is my good companion.","形声字，单人旁表意(指一群人)，火字表声。","A phono-semantic character: the 'person' radical shows meaning (a group of people), '火' gives the sound.",""],
  ["伴","bàn","B 6-7","伙伴","companion","小狗是我的好伴儿。","The puppy is my good companion.","形声字，单人旁表意(陪伴的人)，半字表声。","A phono-semantic character: the 'person' radical shows meaning (a person who accompanies), '半' gives the sound.",""],
  ["冻","dòng","B 6-7","冻冰","to freeze into ice","天太冷，水都冻住了。","It's so cold the water froze.","形声字，两点水表意(与冰、寒冷有关)，东字表声。","A phono-semantic character: the 'ice' radical shows meaning (cold and ice), '东' gives the sound.",""],
  ["井","jǐng","B 8-9","水井","well","村里有一口老水井。","There is an old well in the village.","象形字，像井口四边的木栏，表示水井。","A pictograph showing the wooden frame around a well's mouth.",""],
  ["观","guān","B 8-9","观看","to watch","我们一起观看比赛。","We watch the game together.","形声字，右边\"见\"表示看的意思，左边\"又\"表声。","A phono-semantic character: the \"see\" part on the right shows meaning, the left part gives sound.",""],
  ["百","bǎi","B 8-9","一百","one hundred","妈妈给了我一百块钱。","Mom gave me one hundred dollars.","指事字，在\"一\"和\"白\"上加笔表示数目一百。","An indicative character built from \"one\" and \"white\" to mean the number hundred.",""],
  ["渴","kě","B 8-9","口渴","thirsty","我口渴了，想喝水。","I am thirsty and want to drink water.","形声字，左边三点水表示和水有关，右边\"曷\"表声。","A phono-semantic character: the water radical shows meaning, the right part gives sound.",""],
  ["找","zhǎo","B 8-9","找到","to find","我找到了丢的铅笔。","I found the pencil I lost.","形声字，左边提手旁表示和手的动作有关。","A phono-semantic character: the hand radical shows it relates to a hand action.",""],
  ["别","bié","B 8-9","别人","others","别人的东西不能拿。","You cannot take other people's things.","会意字，右边\"刂\"是刀，表示用刀把东西分开。","An associative character: the knife on the right shows cutting things apart.",""],
  ["际","jì","B 8-9","国际","international","这是一场国际比赛。","This is an international competition.","形声字，左边耳朵旁表意，右边\"祭\"表声。","A phono-semantic character: the left radical shows meaning, the right part gives sound.",""],
  ["千","qiān","B 8-9","千万","ten million / be sure to","天上有成千的星星。","There are thousands of stars in the sky.","指事字，在\"人\"字上加一横表示数目一千。","An indicative character: a stroke added to \"person\" marks the number thousand.",""],
  ["万","wàn","B 8-9","万一","just in case","天上有千万颗星星。","There are millions of stars in the sky.","象形字，原是蝎子的形状，后借来表示数目一万。","A pictographic character: originally a scorpion shape, later borrowed for the number ten thousand.",""],
  ["抬","tái","B 8-9","抬头","to look up","他抬头看着天空。","He looks up at the sky.","形声字，左边提手旁表意，右边\"台\"表声。","A phono-semantic character: the hand radical shows meaning, \"tai\" gives sound.",""],
  ["错","cuò","B 8-9","做错","to do wrong","这道题我做错了。","I got this problem wrong.","形声字，左边金字旁表意，右边\"昔\"表声。","A phono-semantic character: the metal radical shows meaning, \"xi\" gives sound.",""],
  ["时","shí","C 1-2","时间","time","现在是吃饭的时候。","Now it is time to eat.","形声字，左边\"日\"表示和时间有关，右边\"寸\"表声。","A phono-semantic character: the sun radical relates to time, the right part gives sound.",""],
  ["间","jiān","C 1-2","中间","middle","我站在两个人中间。","I stand in the middle of two people.","会意字，门里有日，表示门缝里透进光的中间。","An associative character: sun inside a door shows light coming through a gap.",""],
  ["怎","zěn","C 1-2","怎么","how","你怎么不来上学？","Why didn't you come to school?","形声字，下面\"心\"表意，上面\"乍\"表声。","A phono-semantic character: the heart below shows meaning, the top gives sound.",""],
  ["摸","mō","C 1-2","摸一摸","to touch","我轻轻摸了摸小狗。","I gently touched the puppy.","形声字，左边提手旁表意，右边\"莫\"表声。","A phono-semantic character: the hand radical shows meaning, \"mo\" gives sound.",""],
  ["到","dào","C 1-2","到达","to arrive","我们到学校了。","We arrived at school.","形声字，左边\"至\"表示到达，右边\"刂\"表声。","A phono-semantic character: \"reach\" on the left shows meaning, the right part gives sound.",""],
  ["答","dá","C 1-2","回答","to answer","老师问，我来回答。","The teacher asks, and I answer.","形声字，上面竹字头表意，下面\"合\"表声。","A phono-semantic character: the bamboo top shows meaning, \"he\" gives sound.","回答的答（dá，to answer）；答应的答（dā，to agree）"],
  ["升","shēng","C 1-2","升起","to rise","太阳从东边升起来。","The sun rises from the east.","象形字，本是量米的器具，后引申为上升的意思。","A pictographic character: originally a grain measure, later meaning to rise.",""],
  ["昨","zuó","C 1-2","昨天","yesterday","昨天我去了公园。","Yesterday I went to the park.","形声字，左边\"日\"表示和日子有关，右边\"乍\"表声。","A phono-semantic character: the sun radical relates to days, the right part gives sound.",""],
  ["汗","hàn","C 3-4","出汗","to sweat","跑步后我出了好多汗。","After running I sweated a lot.","形声字，左边三点水表示汗是水，右边\"干\"表声。","A phono-semantic character: the water radical shows sweat is liquid, \"gan\" gives sound.",""],
  ["指","zhǐ","C 3-4","手指","finger","他用手指着天上的云。","He points at the clouds in the sky with his finger.","形声字，左边提手旁表意，右边\"旨\"表声。","A phono-semantic character: the hand radical shows meaning, \"zhi\" gives sound.",""],
  ["体","tǐ","C 3-4","身体","body","多运动，身体才健康。","Exercise more to keep the body healthy.","会意字，由\"人\"和\"本\"组成，表示人的根本是身体。","An associative character: \"person\" plus \"root\" shows the body is a person's foundation.",""],
  ["正","zhèng","C 3-4","正在","in the middle of","妈妈正在做饭。","Mom is cooking right now.","会意字，由\"一\"和\"止\"组成，表示朝目标走得正、不偏。","An associative character: a line plus \"foot\" shows walking straight toward a goal.","正在的正（zhèng，in progress）；正月的正（zhēng，first lunar month）"],
  ["伸","shēn","C 3-4","伸手","to reach out one's hand","我伸手去拿苹果。","I reach out my hand to get the apple.","形声字，左边\"亻\"(人)表意，右边\"申\"表声，本义是把身体或手脚展开。","A phono-semantic character: the left part 亻(person) gives the meaning, and 申 gives the sound; it means to stretch out.",""],
  ["帮","bāng","C 3-4","帮忙","to help","我帮妈妈做饭。","I help mom cook.","形声字，下边\"巾\"(布)表意，上边\"邦\"表声，引申为帮助。","A phono-semantic character: 巾(cloth) below gives the meaning and 邦 above gives the sound; it means to help.",""],
  ["翻","fān","C 3-4","翻书","to turn the pages of a book","我翻开新的一页。","I turn to a new page.","形声字，右边\"羽\"(羽毛)表意，像鸟翻飞，左边\"番\"表声。","A phono-semantic character: 羽(feathers) on the right gives the meaning like a bird flipping, and 番 gives the sound.",""],
  ["脚","jiǎo","C 3-4","脚步","footstep","我用脚踢皮球。","I kick the ball with my foot.","形声字，左边\"月\"(肉)表意表示身体部位，右边\"却\"表声。","A phono-semantic character: 月(flesh) on the left shows it is a body part, and 却 gives the sound.",""],
  ["掌","zhǎng","C 3-4","手掌","palm of the hand","小狗舔我的手掌。","The puppy licks my palm.","形声字，下边\"手\"表意，上边\"尚\"表声，指手心。","A phono-semantic character: 手(hand) below gives the meaning and 尚 above gives the sound; it means the palm.",""],
  ["哈","hā","C 3-4","哈哈","ha-ha (laughter)","他哈哈大笑起来。","He bursts out laughing, ha-ha.","形声字，左边\"口\"表意表示和嘴有关，右边\"合\"表声，模仿笑声。","A phono-semantic character: 口(mouth) on the left shows it relates to the mouth, and 合 gives the sound, imitating laughter.",""],
  ["桌","zhuō","C 5-6","桌子","table","书放在桌子上。","The book is on the table.","形声字，下边\"木\"表意表示是木制家具，上边\"卓\"表声。","A phono-semantic character: 木(wood) below shows it is wooden furniture and 卓 gives the sound.",""],
  ["椅","yǐ","C 5-6","椅子","chair","我坐在小椅子上。","I sit on the little chair.","形声字，左边\"木\"表意表示木制家具，右边\"奇\"表声。","A phono-semantic character: 木(wood) on the left shows it is wooden furniture and 奇 gives the sound.",""],
  ["袜","wà","C 5-6","袜子","socks","我穿上红袜子。","I put on red socks.","形声字，左边\"衤\"(衣)表意表示是衣物，右边\"末\"表声。","A phono-semantic character: 衤(clothing) on the left shows it is something worn and 末 gives the sound.",""],
  ["裤","kù","C 5-6","裤子","pants","这条裤子很合身。","These pants fit well.","形声字，左边\"衤\"(衣)表意表示是衣物，右边\"库\"表声。","A phono-semantic character: 衤(clothing) on the left shows it is a garment and 库 gives the sound.",""],
  ["鞋","xié","C 5-6","鞋子","shoes","我会自己穿鞋子。","I can put on my shoes by myself.","形声字，左边\"革\"(皮革)表意表示用皮做，右边\"圭\"表声。","A phono-semantic character: 革(leather) on the left shows it is made of leather and 圭 gives the sound.",""],
  ["迟","chí","C 5-6","迟到","to be late","上学不要迟到。","Don't be late for school.","形声字，\"辶\"(走)表意表示和行走有关，\"尺\"表声，本义是慢、晚。","A phono-semantic character: 辶(walking) gives the meaning of movement and 尺 gives the sound; it means slow or late.",""],
  ["定","dìng","C 5-6","一定","definitely","我一定会努力。","I will definitely try hard.","形声字，上边\"宀\"(房子)表意表示安稳，下边\"正\"表声，本义是安定。","A phono-semantic character: 宀(roof) above suggests stability and 正 gives the sound; it means settled or stable.",""],
  ["处","chù","C 5-6","到处","everywhere","花儿到处都开了。","Flowers are blooming everywhere.","会意字，上边\"夂\"像脚停下，本义是停下、所在的地方。","An associative character: 夂 above looks like a foot stopping; it means to stay or a place.","到处的处（chù，place）；处理的处（chǔ，to handle）"],
  ["件","jiàn","C 5-6","一件","one (piece of)","我买了一件衣服。","I bought a piece of clothing.","会意字，由\"亻\"(人)和\"牛\"组成，本义是分解，后用作量词。","An associative character made of 亻(person) and 牛(ox), originally meaning to divide; now used as a measure word.",""],
  ["岳","yuè","C 7-8","山岳","high mountains","那座山岳很高大。","That mountain is very tall.","会意字，上边\"丘\"下边\"山\"，表示重叠的高大山峰。","An associative character: 丘(hill) above 山(mountain), showing tall layered peaks.",""],
  ["钱","qián","C 7-8","金钱","money","我用钱买了糖。","I used money to buy candy.","形声字，左边\"钅\"(金)表意表示和金属有关，右边\"戋\"表声。","A phono-semantic character: 钅(metal) on the left relates to metal and 戋 gives the sound.",""],
  ["买","mǎi","C 7-8","买菜","to buy groceries","妈妈去市场买菜。","Mom goes to the market to buy groceries.","会意字，繁体\"買\"上\"网\"下\"贝\"(钱)，表示用钱换取东西。","An associative character: the traditional form 買 has a net over 贝(money), meaning to get things with money.",""],
  ["纸","zhǐ","C 7-8","纸张","paper","我在纸上画画。","I draw on the paper.","形声字，左边\"纟\"(丝)表意表示和纤维有关，右边\"氏\"表声。","A phono-semantic character: 纟(silk) on the left relates to fibers and 氏 gives the sound.",""],
  ["篮","lán","C 7-8","篮球","basketball","我们一起打篮球。","We play basketball together.","形声字，上边\"竹\"表意表示用竹子编的，下边\"监\"表声。","A phono-semantic character: 竹(bamboo) above shows it is woven from bamboo and 监 gives the sound.",""],
  ["沙","shā","C 7-8","沙子","sand","我在沙子里玩。","I play in the sand.","会意字，由\"氵\"(水)和\"少\"组成，表示水少时露出的细小石粒。","An associative character made of 氵(water) and 少(few), showing tiny grains where water is scarce.",""],
  ["枝","zhī","C 7-8","树枝","tree branch","小鸟站在树枝上。","A little bird stands on the branch.","形声字，左边\"木\"表意表示和树木有关，右边\"支\"表声。","A phono-semantic character: 木(wood) on the left relates to trees and 支 gives the sound.",""],
  ["以","yǐ","C 7-8","可以","can; may","我可以吃一块饼干吗。","May I have a cookie?","会意字，古字形像人用工具劳作，后引申为用、拿来做的意思。","An ideogram; the old form shows a person using a tool, later meaning 'to use' or 'by means of'.",""],
  ["跟","gēn","C 7-8","跟着","to follow","小狗跟着我回家了。","The puppy followed me home.","形声字，左边足表意跟脚有关，右边艮表声。","A phono-semantic character; '足'(foot) gives the meaning and '艮' gives the sound.",""],
  ["离","lí","C 9","离开","to leave","妈妈每天早上离开家上班。","Mom leaves home for work every morning.","形声字，本指一种鸟，后假借表示分开、离别。","Originally a bird name, later borrowed to mean 'to separate' or 'leave'.",""],
  ["如","rú","C 9","如果","if","如果下雨，我们就回家。","If it rains, we'll go home.","会意字，由女和口组成，表示听从话语，引申为依照、像。","An ideogram of '女'(woman) and '口'(mouth), meaning to comply, later 'like' or 'if'.",""],
  ["果","guǒ","C 9","水果","fruit","我最喜欢吃水果。","I like eating fruit the most.","象形字，像树上结满果实的样子，本义就是果子。","A pictograph showing a tree laden with fruit; its original meaning is 'fruit'.",""],
  ["因","yīn","C 9","因为","because","因为天黑了，我们要回家。","Because it's getting dark, we should go home.","会意字，像人躺在垫席上，借表凭借、原因。","An ideogram of a person on a mat; borrowed to mean 'cause' or 'because'.",""],
  ["为","wèi","C 9","因为","because","我为大家唱一首歌。","I'll sing a song for everyone.","会意字，古字形像手牵着大象去做事，本义是做。","An ideogram showing a hand leading an elephant to work, meaning 'to do'.","行为的为（wéi，to act / behavior）；因为的为（wèi，because）"],
  ["变","biàn","C 9","变化","change","天气一下子变冷了。","The weather suddenly turned cold.","形声字，下边攵(攴)表意跟动作有关，上部表声，意为改变。","A phono-semantic character; the lower part suggests action, meaning 'to change'.",""],
  ["捕","bǔ","C 9","捕鱼","to catch fish","猫想去捕一只小老鼠。","The cat wants to catch a little mouse.","形声字，左边扌(手)表意跟手抓有关，右边甫表声。","A phono-semantic character; '扌'(hand) gives the meaning of catching, '甫' gives the sound.",""],
  ["棵","kē","C 9","一棵树","a tree","院子里有一棵大树。","There is a big tree in the yard.","形声字，左边木表意跟树木有关，右边果表声，用作量词。","A phono-semantic character; '木'(tree) gives meaning, '果' gives sound; a measure word for plants.",""],
  ["孩","hái","C 10","孩子","child","那个孩子笑得很开心。","That child is laughing happily.","形声字，左边子表意跟孩童有关，右边亥表声。","A phono-semantic character; '子'(child) gives the meaning, '亥' gives the sound.",""],
  ["躲","duǒ","C 10","躲藏","to hide","小猫躲在椅子下面。","The kitten is hiding under the chair.","形声字，左边身表意跟身体有关，右边朵表声，意为藏起身体。","A phono-semantic character; '身'(body) gives meaning, '朵' gives sound; to hide oneself.",""],
  ["能","néng","C 10","能干","capable","我能自己穿好衣服。","I can dress myself.","象形字，本像一种熊类动物，后引申为能力、能够。","A pictograph of a bear-like animal, later meaning 'ability' or 'can'.",""],
  ["狐","hú","D 1-2","狐狸","fox","一只狐狸跑进了树林。","A fox ran into the woods.","形声字，左边犭(犬)表意跟动物有关，右边瓜表声。","A phono-semantic character; '犭'(animal) gives meaning, '瓜' gives sound.",""],
  ["狸","lí","D 1-2","狐狸","fox","狐狸的尾巴又长又大。","The fox has a long, big tail.","形声字，左边犭(犬)表意跟动物有关，右边里表声。","A phono-semantic character; '犭'(animal) gives meaning, '里' gives sound.",""],
  ["馋","chán","D 1-2","嘴馋","greedy for food","看到蛋糕我就嘴馋了。","Seeing the cake makes my mouth water.","形声字，左边饣(食)表意跟吃有关，右边表声，意为贪吃。","A phono-semantic character; '饣'(food) gives meaning; it means greedy for food.",""],
  ["直","zhí","D 1-2","直线","straight line","请你把腰站直。","Please stand up straight.","会意字，上面是目(眼睛)上加一竖，表示直视、不弯。","An ideogram with an eye and a vertical line, meaning 'straight'.",""],
  ["流","liú","D 1-2","流水","flowing water","小河里的水慢慢地流。","The water in the stream flows slowly.","形声字，左边氵(水)表意跟水有关，右边表声，意为水流动。","A phono-semantic character; '氵'(water) gives meaning; it means 'to flow'.",""],

/* ===================== 数据层（多教材） ===================== */
function curKey(){ return "cn_fc_current_"+currentProfile; }
function bookKey(id){ return "cn_fc_"+id+"_"+currentProfile; }
function bookById(id){ return TEXTBOOKS.find(b=>b.id===id)||TEXTBOOKS[0]; }
function buildCMAP(book){ const m={}; book.data.forEach(a=>{ m[a[0]]={py:a[1],lesson:a[2],exZh:a[3],exEn:a[4],senZh:a[5],senEn:a[6],srcZh:a[7],srcEn:a[8],readings:a[9]||null}; }); return m; }
function seedBook(book){
  const s={cards:{},order:[],settings:{roundSize:10,speak:true,mode:"mix"}};
  book.data.forEach(a=>{
    s.cards[a[0]]={ch:a[0],py:a[1],lesson:a[2],exZh:a[3],exEn:a[4],senZh:a[5],senEn:a[6],srcZh:a[7],srcEn:a[8],readings:a[9]||null,mastery:0,weight:3,seen:0,right:0,wrong:0,streak:0};
    s.order.push(a[0]);
  });
  return s;
}
function loadBookStore(book){
  // Try profile-scoped key first
  try{
    const raw=JSON.parse(localStorage.getItem(bookKey(book.id)));
    if(raw&&raw.cards){
      // Refresh card content from curriculum (keep progress)
      const cmap=buildCMAP(book);
      for(const[ch,card]of Object.entries(raw.cards)){
        const c=cmap[ch]; if(!c)continue;
        card.exZh=c.exZh; card.exEn=c.exEn; card.senZh=c.senZh; card.senEn=c.senEn;
        card.srcZh=c.srcZh; card.srcEn=c.srcEn; card.readings=c.readings;
      }
      return raw;
    }
  }catch(e){}
  // Fallback: try old key without profile suffix (migrate data)
  try{
    const oldKey="cn_fc_"+book.id;
    const old=JSON.parse(localStorage.getItem(oldKey));
    if(old&&old.cards){
      // Migrate: save under new key
      localStorage.setItem(bookKey(book.id), JSON.stringify(old));
      return old;
    }
  }catch(e){}
  return seedBook(book);
}

/* ===================== 间隔重复 ===================== */
function grade(card,correct){
  card.seen++;
  if(correct){ card.right++; card.streak++; card.mastery=Math.min(5,card.mastery+1); card.weight=Math.max(0.4,card.weight*0.55); }
  else{ card.wrong++; card.streak=0; card.mastery=Math.max(0,card.mastery-2); card.weight=Math.min(12,card.weight*1.8+1.5); }
}
function activeCards(){
  let list=store.order.map(c=>store.cards[c]).filter(Boolean);
  if(curLesson!=="all") list=list.filter(c=>c.lesson===curLesson);
  if(focusMode){
    // Find current milestone threshold and filter to cards below it
    const thresh=getCurrentMilestoneThreshold(list);
    if(thresh>0) list=list.filter(c=>c.mastery<thresh);
  }
  return list;
}
function getCurrentMilestoneThreshold(cards){
  const t=cards.length;if(!t)return 0;
  // Milestones: seen>0 → mastery≥3 → mastery≥4 → mastery≥5
  const started=cards.filter(c=>c.seen>0).length;
  if(started<t) return 1; // focus: unseen cards (seen=0 → mastery<1)
  const half=cards.filter(c=>c.mastery>=3).length;
  if(half<t) return 3;
  const ninety=cards.filter(c=>c.mastery>=4).length;
  if(ninety<t) return 4;
  const full=cards.filter(c=>c.mastery>=5).length;
  if(full<t) return 5;
  return 0; // all done
}
function toggleFocus(){
  focusMode=!focusMode;
  const btn=document.getElementById('focusBtn');
  btn.style.background=focusMode?'var(--primary)':'#fff';
  btn.style.color=focusMode?'#fff':'var(--text)';
  startRound();
}
function buildRound(){
  const cards=activeCards(); if(!cards.length) return [];
  const n=Math.min(store.settings.roundSize||10,cards.length);
  const pool=cards.map(c=>({c,key:Math.pow(Math.random(),1/(c.weight+0.1))}));
  pool.sort((a,b)=>b.key-a.key);
  return pool.slice(0,n).map(x=>x.c);
}
function makeOptions(card,type){
  const correct=type==='char'?card.ch:card.py;
  const all=type==='char'?store.order.slice():[...new Set(store.order.map(c=>store.cards[c].py).filter(Boolean))];
  const wrong=all.filter(v=>v!==correct);
  for(let i=wrong.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[wrong[i],wrong[j]]=[wrong[j],wrong[i]];}
  const opts=[correct,...wrong.slice(0,3)];
  for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]];}
  return opts;
}

let round=[],idx=0,rightCount=0,curLesson="all",answered=false,curType="py",focusMode=false;
function startRound(){
  round=buildRound(); idx=0; rightCount=0;
  if(!round.length){ renderEmpty(); updateStats(); updateProgress(); return; }
  renderCard(); updateStats(); updateProgress();
}
function renderEmpty(){ document.getElementById('card-wrap').innerHTML=`<div class="empty">这一课还没有字～<br>换个课次，或到「字表」里添加。</div>`; }
function renderCard(){
  answered=false;
  const card=round[idx];
  const mode=store.settings.mode||'py';
  // 4 quiz types: py(字→拼音), char(拼音→字), listen(听发音选字), fill(组词填空)
  const quizTypes = card.mastery < 2 ? ['py','char'] : ['py','char','listen','fill'];
  if(mode==='mix'){
    if(!window._typeIdx) window._typeIdx=0;
    curType=quizTypes[window._typeIdx % quizTypes.length];
    window._typeIdx++;
  } else curType=mode;

  let opts, correctVal, q, big, optsHtml;
  const dots=Array.from({length:5},(_,i)=>`<span class="dot ${i<card.mastery?'on':''}"></span>`).join('');

  if(curType==='listen'){
    // 听发音选字: play word audio, pick the character
    const wordText = card.exZh ? (card.exZh+'的'+card.ch) : card.ch;
    opts=makeOptions(card,'char');
    correctVal=card.ch;
    q='听发音，选汉字 &nbsp;Listen and pick';
    big=`<div class="char" id="charBig" style="cursor:pointer;color:var(--primary)" onclick="speak('${wordText.replace(/'/g,"\\'")}')">🔊</div><div style="font-size:14px;color:var(--muted)">点击播放 Tap to play</div>`;
    optsHtml=opts.map(o=>`<button class="opt" data-val="${o}" style="font-size:32px">${o}${toTrad(o)?`<span style="font-size:16px;color:var(--muted)">/${toTrad(o)}</span>`:''}</button>`).join('');
    setTimeout(()=>speak(wordText),300);
  } else if(curType==='fill'){
    // 组词填空: show word with blank, pick the missing character
    const word = card.exZh || card.ch;
    const blankWord = word.replace(card.ch, '___');
    if(blankWord === word){
      // Character not in example word, fall back to py mode
      curType='py'; opts=makeOptions(card,'py'); correctVal=card.py;
      q='这个字念什么？ &nbsp;What\'s the pinyin?';

    }

  } else {
    opts=makeOptions(card,'py'); correctVal=card.py;
    q='这个字念什么？ &nbsp;What\'s the pinyin?';
    big=`<div class="char" id="charBig">${card.ch}${toTrad(card.ch)?`<span style="font-size:40%;color:var(--muted)">/${toTrad(card.ch)}</span>`:''}</div>`;
    optsHtml=opts.map(o=>`<button class="opt" data-val="${o}">${o}</button>`).join('');
  }
  document.getElementById('card-wrap').innerHTML=`
    <div class="card">
      ${card.lesson?`<div class="lesson-tag">${lessonDisplay(card.lesson)}</div>`:''}
      <div class="quiz-side">
        <div class="quiz-q">${q}</div>
        ${big}
        <div class="mastery-dots">${dots}</div>

    </div>`;
  document.getElementById('opts').querySelectorAll('.opt').forEach(b=>{ b.onclick=()=>choose(b.dataset.val,correctVal,b); });
  startTimer();
}
function choose(picked,correctVal,btn){
  if(answered) return; answered=true;
  const card=round[idx]; const correct=picked===correctVal;
  const responseTime=Date.now()-cardShownAt;
  const isFast=correct&&responseTime<=FAST_THRESHOLD;
  document.getElementById('opts').querySelectorAll('.opt').forEach(b=>{
    if(b.dataset.val===correctVal) b.classList.add('correct');
    else if(b===btn) b.classList.add('wrong');
    else b.classList.add('dim');
    b.onclick=null;
  });
  // Double-click: correct→tap again to next; wrong→must tap correct first
  if(correct){
    const cb=[...document.getElementById('opts').querySelectorAll('.opt')].find(b=>b.dataset.val===correctVal);
    if(cb) setTimeout(()=>{cb.onclick=()=>next();},300);
  } else {
    const cb=[...document.getElementById('opts').querySelectorAll('.opt')].find(b=>b.dataset.val===correctVal);
    if(cb){cb.style.animation='pulse 0.6s infinite';
      setTimeout(()=>{cb.onclick=()=>{cb.style.animation='';cb.onclick=()=>next();};},300);}
  }
  grade(card,correct);
  if(correct) rightCount++;
  else if(round.filter(c=>c===card).length<2) round.push(card);
  save(); updateStats();
  if(store.settings.speak) speak(sayInWord(card));
  const last=idx>=round.length-1;
  const speedBadge=isFast?'<span class="speed-badge fast">⚡ &lt;1s</span>':correct?`<span class="speed-badge normal">${(responseTime/1000).toFixed(1)}s</span>`:'';
  const revealEl=document.getElementById('revealSlot');
  revealEl.innerHTML=`
    <div class="reveal">
      <div class="top"><span style="font-size:36px;font-weight:700">${card.ch}</span>${toTrad(card.ch)?`<span style="font-size:20px;color:var(--muted)">/${toTrad(card.ch)}</span>`:''} <span class="bigpy">${card.py}</span><span class="res ${correct?'ok':'no'}">${correct?'✓ 答对了':'✗ 再记一记'}</span>${speedBadge}</div>
      ${card.readings&&card.readings.length>1
        ?`<div class="block"><span class="lbl">多音字 POLYPHONE</span><br>${card.readings.map(r=>`<span class="zh">${r[1]}</span> <b style="color:var(--primary)">${r[0]}</b> <span class="en">${r[2]||''}</span>`).join('<br>')}</div>`
        :(card.exZh?`<div class="block"><span class="lbl">例词 WORD</span><br><span class="zh">${card.exZh}</span> &nbsp;<span class="en">${card.exEn||''}</span></div>`:'')}
      ${card.senZh?`<div class="block"><span class="lbl">例句 SENTENCE</span><br><span class="zh">${card.senZh}</span><br><span class="en">${card.senEn||''}</span></div>`:''}
      ${card.srcZh?`<div class="block"><span class="lbl">字源 · 怎么记 HOW TO REMEMBER</span><br>${card.srcZh}<br><span class="en">${card.srcEn||''}</span></div>`:''}
      <div class="actions"><button class="btn good" id="nextBtn">${last?'看本轮成绩 ▶':'下一个 ▶'}</button></div>
      <div class="sub-actions"><button class="ghost" id="replayBtn">🔊 读字＋例句 Read word & sentence</button></div>
    </div>`;
  document.getElementById('nextBtn').onclick=next;
  document.getElementById('replayBtn').onclick=()=>speak(sayInWord(card)+"。"+(card.senZh||""));
  // No auto-scroll on mobile
}
function next(){ idx++; updateStats(); if(idx>=round.length) renderResult(); else renderCard(); }
function updateStats(){
  document.getElementById('p-done').textContent=Math.min(idx,round.length);
  document.getElementById('p-total').textContent=round.length;
  document.getElementById('p-right').textContent=rightCount;
  document.getElementById('p-master').textContent=activeCards().filter(c=>c.mastery>=4).length;
  updateProgress();
}
function updateProgress(){
  const el=document.getElementById('progressPanel');if(!el)return;
  const cards=activeCards();if(!cards.length){el.innerHTML='';return;}
  const total=cards.length;
  const started=cards.filter(c=>c.seen>0).length;
  const half=cards.filter(c=>c.mastery>=3).length;
  const ninety=cards.filter(c=>c.mastery>=4).length;
  const full=cards.filter(c=>c.mastery>=5).length;
  const pct=total>0?Math.round(full/total*100):0;
  const overallPct=total>0?Math.round(cards.reduce((s,c)=>s+c.mastery,0)/(total*5)*100):0;

  const milestones=[
    {label:`🌱 开始 Started ${started}/${total}`,done:started>=total,current:started>0&&started<total},
    {label:`⭐ 50% 掌握 ${half}/${total}`,done:half>=total,current:half>0&&half<total},
    {label:`🔥 90% 掌握 ${ninety}/${total}`,done:ninety>=total,current:ninety>0&&ninety<total},
    {label:`🏆 100% 精通 ${full}/${total}`,done:full>=total,current:full>0&&full<total},
  ];
  el.innerHTML=`
    <div style="display:flex;justify-content:space-between;font-size:13px;font-weight:700;color:var(--text)">
      <span>总进度 Overall Progress</span><span>${overallPct}%</span>
    </div>
    <div class="prog-bar"><div class="prog-fill" style="width:${overallPct}%;background:linear-gradient(90deg,var(--primary2),var(--good))"></div></div>
    <div class="milestones">${milestones.map(m=>`<span class="ms ${m.done?'done':m.current?'current':''}" ${m.current?'onclick="if(!focusMode)toggleFocus()" style="cursor:pointer" title="点击专注此目标"':''}>${m.label}${m.current&&focusMode?' ✓':''}</span>`).join('')}</div>
    ${focusMode?`<div style="font-size:12px;color:var(--primary);font-weight:700;margin-top:4px">🎯 专注模式：只练习未达标的字 (${activeCards().length}个)</div>`:''}`;

}
function renderResult(){
  const total=round.length; const score=total?Math.round(rightCount/total*100):0;
  const g=score>=90?["🏆","太棒啦！"]:score>=70?["⭐","很不错！"]:score>=50?["👍","继续加油！"]:["💪","多练几次就会啦！"];
  const rows=[...new Set(round)].sort((a,b)=>a.mastery-b.mastery)
    .map(c=>`<tr><td style="font-size:24px">${c.ch}</td><td style="color:var(--muted)">${c.py||''}</td><td>${'●'.repeat(c.mastery)}${'○'.repeat(5-c.mastery)}</td><td class="r">${c.mastery>=4?'已掌握':c.mastery>=2?'还行':'要加强'}</td></tr>`).join('');
  document.getElementById('card-wrap').innerHTML=`
    <div class="result"><div style="font-size:46px">${g[0]}</div><div class="grade">${g[1]}</div>
      <div class="score">${score}<span style="font-size:28px">分</span></div>
      <div style="color:var(--muted)">答对 ${rightCount} / ${total}</div>
      <table>${rows}</table>
      <div class="actions"><button class="btn good" id="again">再来一轮 ▶</button></div></div>`;
  document.getElementById('again').onclick=startRound;
  speak(score>=70?"真棒":"加油");
  // Save progress to cloud after each round
  save(); saveToCloud();
}

/* ===================== 语音 ===================== */
function sayInWord(card){
  if(card.readings && card.readings.length>1) return card.readings.map(r=>r[1]+"的"+card.ch).join("，也可以是");
  if(card.exZh && card.exZh.indexOf(card.ch)>=0) return card.exZh+"的"+card.ch;
  return card.ch;
}
function speak(text){
  if(!('speechSynthesis' in window)) return;
  try{ speechSynthesis.cancel();
    const isJP = curBook && (curBook.id === 'jp_kana' || curBook.id === 'jp_katakana');
    const lang = isJP ? 'ja-JP' : 'zh-CN';
    const u=new SpeechSynthesisUtterance(text); u.lang=lang; u.rate=0.75; u.pitch=1.1;
    const voices=speechSynthesis.getVoices();
    let v;
    if(isJP){ v=voices.find(v=>v.lang.startsWith('ja')); }
    else {
      // Priority: exact zh-CN > name contains Mandarin/普通/国语 > zh-CN prefix > zh excluding Cantonese
      v = voices.find(v=>v.lang==='zh-CN')
        || voices.find(v=>v.lang.startsWith('zh-CN'))
        || voices.find(v=>/Mandarin|普通|国语|Tingting|Tian-Tian/i.test(v.name)&&v.lang.startsWith('zh'))
        || voices.find(v=>v.lang==='cmn-CN'||v.lang.startsWith('cmn'))
        || voices.find(v=>v.lang.startsWith('zh')&&!/HK|TW|Cantonese|yue/i.test(v.lang+v.name));
    }
    if(v) u.voice=v;
    speechSynthesis.speak(u);
  }catch(e){}
}

function parseLine(line){
  const ch=(line.match(/[一-鿿]/)||[])[0]; if(!ch) return null;
  let py="";
  line.split(/\s+/).forEach(tok=>{ if(/[a-zāáǎàēéěèīíǐìōóǒòūúǔùǖǘǚǜ／\/]/i.test(tok)&&!/[一-鿿]/.test(tok)) py=py||tok; });
  return {ch,py};
}
document.getElementById('saveChars').onclick=()=>{

      exZh:(old&&old.exZh)||d.exZh||"", exEn:(old&&old.exEn)||d.exEn||"",

/* ===================== Cloud Sync via GitHub Gist ===================== */
const GIST_TOKEN = '';
const GIST_FILE = 'cn_flashcard_sync.json';
let GIST_ID = localStorage.getItem('cn_fc_gist_id') || '';
let cloudSyncPending = false, lastCloudSave = 0, cloudLoading = false;

function getAllProfileData() {
  // Only upload current active profile to avoid overwriting others with empty data
  const pid = currentProfile;
  const data = { profile: pid, savedAt: new Date().toISOString(), v: 3, profiles: PROFILES, books: {} };
  data.books[pid] = {};
  for (const b of TEXTBOOKS) {
    const key = 'cn_fc_' + b.id + '_' + pid;
    try {
      const st = JSON.parse(localStorage.getItem(key));
      if (!st || !st.cards) continue;
      const progress = {};
      for (const [ch, card] of Object.entries(st.cards)) {
        if (card.seen > 0 || card.mastery > 0) {
          progress[ch] = { m: card.mastery, w: card.weight, s: card.seen, r: card.right, x: card.wrong, k: card.streak };
        }
      }
      if (Object.keys(progress).length > 0) {
        data.books[pid][b.id] = { settings: st.settings, progress };
      }
    } catch(e) {}
  }
  return data;
}

function restoreAllProfileData(data) {
  if (!data || !data.books) return 0;
  // Merge profiles from cloud
  if (data.profiles && Array.isArray(data.profiles)) {
    const existing = new Set(PROFILES.map(p => p.id));
    for (const p of data.profiles) {
      if (!existing.has(p.id)) { PROFILES.push(p); existing.add(p.id); }
    }
    saveProfiles();
    renderProfileBar();
  }
  let count = 0;
  for (const [pid, books] of Object.entries(data.books)) {
    for (const [bid, cloudData] of Object.entries(books)) {
      const key = 'cn_fc_' + bid + '_' + pid;
      if ((data.v >= 2) && cloudData.progress) {
        const book = bookById(bid);
        if (!book) continue;
        let local;
        try { local = JSON.parse(localStorage.getItem(key)); } catch(e) {}
        if (!local || !local.cards) {
          const origProfile = currentProfile;
          currentProfile = pid;
          local = seedBook(book);
          currentProfile = origProfile;
        }
        if (cloudData.settings) local.settings = cloudData.settings;
        for (const [ch, p] of Object.entries(cloudData.progress)) {
          if (local.cards[ch]) {
            // Merge: keep whichever has more total practice (seen)
            const localSeen = local.cards[ch].seen || 0;
            if (p.s >= localSeen) {
              local.cards[ch].mastery = p.m; local.cards[ch].weight = p.w;
              local.cards[ch].seen = p.s; local.cards[ch].right = p.r;
              local.cards[ch].wrong = p.x; local.cards[ch].streak = p.k;
            }
          }
        }
        localStorage.setItem(key, JSON.stringify(local));
        count++;
      } else if (typeof cloudData === 'string') {
        // V1 format: raw JSON string
        localStorage.setItem(key, cloudData);
        count++;
      }
    }
  }
  return count;
}

async function saveToCloud() {
  if (cloudSyncPending || cloudLoading) return;
  const now = Date.now();
  if (now - lastCloudSave < 5000) { setTimeout(saveToCloud, 5000 - (now - lastCloudSave)); return; }
  cloudSyncPending = true; lastCloudSave = now;
  const payload = btoa(unescape(encodeURIComponent(JSON.stringify(getAllProfileData()))));
  try {
    if (GIST_ID) {
      await fetch('https://api.github.com/gists/' + GIST_ID, {
        method: 'PATCH',
        headers: { 'Authorization': 'token ' + GIST_TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ files: { [GIST_FILE]: { content: payload } } })
      });
    } else {
      const resp = await fetch('https://api.github.com/gists', {
        method: 'POST',
        headers: { 'Authorization': 'token ' + GIST_TOKEN, 'Content-Type': 'application/json' },
        body: JSON.stringify({ description: '认字小卡片 进度同步', public: false, files: { [GIST_FILE]: { content: payload } } })
      });
      const data = await resp.json();
      if (data.id) { GIST_ID = data.id; localStorage.setItem('cn_fc_gist_id', GIST_ID); }
    }
    updateSyncStatus('☁️ 已同步 ' + new Date().toLocaleTimeString('zh-CN'));
  } catch(e) { updateSyncStatus('⚠️ 同步失败'); }
  cloudSyncPending = false;
}

async function loadFromCloud() {
  cloudLoading = true;
  updateSyncStatus('☁️ 加载中...');
  try {
    if (!GIST_ID) {
      const resp = await fetch('https://api.github.com/gists?per_page=100', {
        headers: { 'Authorization': 'token ' + GIST_TOKEN }
      });
      const gists = await resp.json();
      const found = gists.find(g => g.files && g.files[GIST_FILE]);
      if (found) { GIST_ID = found.id; localStorage.setItem('cn_fc_gist_id', GIST_ID); }
    }
    if (!GIST_ID) { updateSyncStatus('☁️ 云端无数据'); return; }
    const resp = await fetch('https://api.github.com/gists/' + GIST_ID, {
      headers: { 'Authorization': 'token ' + GIST_TOKEN }
    });
    if (!resp.ok) { GIST_ID=''; localStorage.removeItem('cn_fc_gist_id'); updateSyncStatus('☁️ 重新搜索...'); return loadFromCloud(); }
    const gist = await resp.json();
    const content = gist.files?.[GIST_FILE]?.content;
    if (content) {
      let data;
      try { data = JSON.parse(decodeURIComponent(escape(atob(content)))); }
      catch(e) { try { data = JSON.parse(content); } catch(e2) { updateSyncStatus('⚠️ 数据损坏'); cloudSyncPending=false; return; } }
      const count = restoreAllProfileData(data);
      store = loadBookStore(curBook);
      document.getElementById('modeSel').value=store.settings.mode||'mix';
      rebuildBookSelect(); rebuildLessonSelect(); buildRoundSizeSel(); startRound();
      updateSyncStatus('☁️ 已加载 (' + (data.savedAt||'').slice(0,19) + ')');
      flash('☁️ 云端进度已同步 ' + count + ' 条记录');
    }
  } catch(e) { updateSyncStatus('⚠️ 加载失败: ' + e.message); }
  cloudLoading = false;
}

function updateSyncStatus(msg) {
  const el = document.getElementById('syncStatus');
  if (el) el.textContent = msg;
}

// Override save to also sync to cloud
const _origSave = save;
save = function() { _origSave(); saveToCloud(); };

/* ===================== 启动 ===================== */
if('speechSynthesis' in window){ speechSynthesis.onvoiceschanged=()=>{}; }
document.getElementById('modeSel').value=store.settings.mode||'mix';
renderProfileBar(); rebuildBookSelect(); rebuildLessonSelect(); buildRoundSizeSel(); startRound();
// Auto-load from cloud on first visit
loadFromCloud();
</script>
</body>
</html>
